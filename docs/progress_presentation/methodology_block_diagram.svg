<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="gData" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8E44AD"/><stop offset="100%" stop-color="#5B2C6F"/></linearGradient>
    <linearGradient id="gBronze" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#CD7F32"/><stop offset="100%" stop-color="#A0522D"/></linearGradient>
    <linearGradient id="gSilver" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#C0C0C0"/><stop offset="100%" stop-color="#909090"/></linearGradient>
    <linearGradient id="gSilverP" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#B8C6DB"/><stop offset="100%" stop-color="#7D94B0"/></linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFD700"/><stop offset="100%" stop-color="#DAA520"/></linearGradient>
    <linearGradient id="gAgent" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2980B9"/><stop offset="100%" stop-color="#1B5E7B"/></linearGradient>
    <linearGradient id="gAdaptive" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#D35400"/><stop offset="100%" stop-color="#A04000"/></linearGradient>
    <linearGradient id="gEval" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#27AE60"/><stop offset="100%" stop-color="#196F3D"/></linearGradient>
    <linearGradient id="gTx" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#16A085"/><stop offset="100%" stop-color="#0E6251"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.18"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker>
    <marker id="arrowThick" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1B5E7B"/></marker>
  </defs>

  <!-- Title -->
  <text x="600" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1B3A5C">CMADS — Proposed Methodology</text>
  <text x="600" y="54" text-anchor="middle" font-size="12" fill="#666">Clinical Multi-Agent Decisioning System · End-to-end pipeline from synthetic patients to treatment plans</text>

  <!-- ─────────────────────────────────────────── -->
  <!-- STAGE A: DATA GENERATION                  -->
  <!-- ─────────────────────────────────────────── -->
  <rect x="40" y="85" width="1120" height="90" rx="12" fill="#FAF5FC" stroke="#C39BD3" stroke-width="1.5"/>
  <text x="60" y="108" font-size="12" font-weight="bold" fill="#6C3483">A · DATA GENERATION</text>

  <rect x="80" y="120" width="220" height="45" rx="8" fill="url(#gData)" filter="url(#shadow)"/>
  <text x="190" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFF">Synthea</text>
  <text x="190" y="157" text-anchor="middle" font-size="10" fill="#F5EEF8">Java CLI · 10 000 synthetic patients</text>

  <text x="320" y="147" font-size="11" fill="#555">Rule-based state machines</text>
  <text x="320" y="161" font-size="10" fill="#888">Monte-Carlo on CDC/NIH statistics · no LLM synthesis</text>

  <rect x="820" y="120" width="300" height="45" rx="8" fill="#FDF2E9" stroke="#D35400" stroke-width="1.2"/>
  <text x="970" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#A04000">Ground Truth</text>
  <text x="970" y="158" text-anchor="middle" font-size="10" fill="#6E2C00">Synthea-declared conditions / meds / labs</text>

  <!-- ─────────────────────────────────────────── -->
  <!-- STAGE B: DATA PIPELINE                    -->
  <!-- ─────────────────────────────────────────── -->
  <rect x="40" y="195" width="1120" height="110" rx="12" fill="#F7F9FC" stroke="#AAB7C4" stroke-width="1.5"/>
  <text x="60" y="218" font-size="12" font-weight="bold" fill="#34495E">B · DATA PIPELINE (medallion architecture)</text>

  <rect x="80" y="233" width="220" height="55" rx="8" fill="url(#gBronze)" filter="url(#shadow)"/>
  <text x="190" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFF">Bronze</text>
  <text x="190" y="273" text-anchor="middle" font-size="9" fill="#FDEBD0">Parquet · ~43 tables · PyArrow</text>

  <rect x="330" y="233" width="220" height="55" rx="8" fill="url(#gSilver)" filter="url(#shadow)"/>
  <text x="440" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Silver</text>
  <text x="440" y="273" text-anchor="middle" font-size="9" fill="#444">OMOP CDM v5.4 · dbt + DuckDB</text>

  <rect x="580" y="233" width="220" height="55" rx="8" fill="url(#gSilverP)" filter="url(#shadow)"/>
  <text x="690" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFF">Silver+</text>
  <text x="690" y="273" text-anchor="middle" font-size="9" fill="#EEE">9 derived features · trends · risk scores</text>

  <rect x="830" y="233" width="290" height="55" rx="8" fill="url(#gGold)" filter="url(#shadow)"/>
  <text x="975" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Gold</text>
  <text x="975" y="273" text-anchor="middle" font-size="9" fill="#444">ehr_case.json + lab_case.json · point-in-time</text>

  <path d="M 300 260 L 330 260" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M 550 260 L 580 260" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M 800 260 L 830 260" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <!-- Filter note -->
  <text x="1100" y="301" text-anchor="end" font-size="9" fill="#888">LLM Lab Verifier filter → 270 high-quality patients</text>

  <!-- ─────────────────────────────────────────── -->
  <!-- STAGE C: MULTI-AGENT PIPELINE             -->
  <!-- ─────────────────────────────────────────── -->
  <rect x="40" y="325" width="1120" height="320" rx="12" fill="#EAF4FB" stroke="#5499C7" stroke-width="1.5"/>
  <text x="60" y="348" font-size="12" font-weight="bold" fill="#1F4E79">C · MULTI-AGENT PIPELINE · LangGraph StateGraph · 7 agents · 6 stages</text>

  <!-- Shared memory strip -->
  <rect x="60" y="363" width="1080" height="24" rx="6" fill="#FDFEFE" stroke="#B2BABB" stroke-dasharray="3 2"/>
  <text x="600" y="380" text-anchor="middle" font-size="10" font-style="italic" fill="#566573">Shared Memory = LangGraph State (TypedDict) · patient_context · agent_outputs · conflicts · execution_trace</text>

  <!-- Stage 1 (parallel) -->
  <rect x="80" y="405" width="200" height="60" rx="8" fill="url(#gAgent)" filter="url(#shadow)"/>
  <text x="180" y="428" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFF">Stage 1a · EHR Analyst</text>
  <text x="180" y="448" text-anchor="middle" font-size="9" fill="#D4E6F1">3 calls · analyse → structure → review</text>

  <rect x="80" y="475" width="200" height="60" rx="8" fill="url(#gAgent)" filter="url(#shadow)"/>
  <text x="180" y="498" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFF">Stage 1b · Lab Interpreter</text>
  <text x="180" y="518" text-anchor="middle" font-size="9" fill="#D4E6F1">Classify · trend · rank by severity</text>

  <text x="180" y="555" text-anchor="middle" font-size="10" font-weight="600" fill="#1F4E79">(parallel fan-out)</text>

  <!-- Arrows from Stage 1 → Stage 2 -->
  <path d="M 280 435 L 330 475" stroke="#1B5E7B" stroke-width="2" fill="none" marker-end="url(#arrowThick)"/>
  <path d="M 280 505 L 330 480" stroke="#1B5E7B" stroke-width="2" fill="none" marker-end="url(#arrowThick)"/>

  <!-- Stage 2 · Diagnostic Reasoning (adaptive) -->
  <rect x="340" y="440" width="220" height="90" rx="10" fill="url(#gAdaptive)" filter="url(#shadow)"/>
  <text x="450" y="465" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFF">Stage 2</text>
  <text x="450" y="483" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFF">Diagnostic Reasoning</text>
  <text x="450" y="502" text-anchor="middle" font-size="9" fill="#FDEBD0">Adaptive loop · max 3 rounds</text>
  <text x="450" y="516" text-anchor="middle" font-size="9" fill="#FDEBD0">stop when confidence ≥ 75</text>

  <!-- Loopback arrow -->
  <path d="M 560 460 Q 600 420 560 470" stroke="#A04000" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
  <text x="575" y="427" font-size="9" fill="#A04000">self-critique</text>

  <path d="M 560 485 L 600 485" stroke="#1B5E7B" stroke-width="2" fill="none" marker-end="url(#arrowThick)"/>

  <!-- Stage 3 · Clinical Reviewer -->
  <rect x="605" y="440" width="200" height="90" rx="10" fill="url(#gAgent)" filter="url(#shadow)"/>
  <text x="705" y="465" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFF">Stage 3</text>
  <text x="705" y="483" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFF">Clinical Reviewer</text>
  <text x="705" y="502" text-anchor="middle" font-size="9" fill="#D4E6F1">Adversarial second opinion</text>
  <text x="705" y="516" text-anchor="middle" font-size="9" fill="#D4E6F1">per-diagnosis verification</text>

  <path d="M 805 485 L 840 485" stroke="#1B5E7B" stroke-width="2" fill="none" marker-end="url(#arrowThick)"/>

  <!-- Stage 4 · Refiner -->
  <rect x="845" y="440" width="220" height="90" rx="10" fill="url(#gAgent)" filter="url(#shadow)"/>
  <text x="955" y="465" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFF">Stage 4</text>
  <text x="955" y="483" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFF">Diagnostic Refiner</text>
  <text x="955" y="502" text-anchor="middle" font-size="9" fill="#D4E6F1">Merge Dx + Reviewer</text>
  <text x="955" y="516" text-anchor="middle" font-size="9" fill="#D4E6F1">→ final differential</text>

  <!-- Row 2: Stages 5 & 6 -->
  <rect x="340" y="565" width="220" height="60" rx="8" fill="url(#gEval)" filter="url(#shadow)"/>
  <text x="450" y="588" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFF">Stage 5 · LLM Evaluator</text>
  <text x="450" y="608" text-anchor="middle" font-size="9" fill="#D5F5E3">DIRECT / INDIRECT / MISS</text>

  <rect x="605" y="565" width="460" height="60" rx="8" fill="url(#gTx)" filter="url(#shadow)"/>
  <text x="835" y="588" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFF">Stage 6 · Treatment Planning</text>
  <text x="835" y="608" text-anchor="middle" font-size="9" fill="#D1F2EB">NICE guidelines (Qdrant + BioLORD-2023) · runs only if DIRECT</text>

  <!-- Arrows from Stage 4 down to Stage 5 -->
  <path d="M 910 530 L 910 555 L 450 555 L 450 565" stroke="#1B5E7B" stroke-width="2" fill="none" marker-end="url(#arrowThick)"/>
  <path d="M 560 595 L 605 595" stroke="#1B5E7B" stroke-width="2" fill="none" marker-end="url(#arrowThick)"/>

  <!-- ─────────────────────────────────────────── -->
  <!-- STAGE D: EVALUATION LOOP                  -->
  <!-- ─────────────────────────────────────────── -->
  <rect x="40" y="665" width="1120" height="80" rx="12" fill="#FEF9E7" stroke="#D4AC0D" stroke-width="1.5"/>
  <text x="60" y="688" font-size="12" font-weight="bold" fill="#7D6608">D · EVALUATION &amp; PORTAL</text>

  <rect x="80" y="700" width="260" height="35" rx="6" fill="#FCF3CF" stroke="#D4AC0D"/>
  <text x="210" y="723" text-anchor="middle" font-size="11" font-weight="600" fill="#7D6608">LLM-as-Judge · Qwen3 32B</text>

  <rect x="360" y="700" width="260" height="35" rx="6" fill="#FCF3CF" stroke="#D4AC0D"/>
  <text x="490" y="723" text-anchor="middle" font-size="11" font-weight="600" fill="#7D6608">Metrics: match rate · rank · timing</text>

  <rect x="640" y="700" width="260" height="35" rx="6" fill="#FCF3CF" stroke="#D4AC0D"/>
  <text x="770" y="723" text-anchor="middle" font-size="11" font-weight="600" fill="#7D6608">Streamlit Portal · DuckDB read-only</text>

  <rect x="920" y="700" width="200" height="35" rx="6" fill="#FCF3CF" stroke="#D4AC0D"/>
  <text x="1020" y="723" text-anchor="middle" font-size="11" font-weight="600" fill="#7D6608">Model A/B comparison</text>

  <!-- Vertical arrows between zones -->
  <path d="M 600 175 L 600 195" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 600 305 L 600 325" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 600 645 L 600 665" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Legend note -->
  <text x="1120" y="158" text-anchor="end" font-size="9" font-style="italic" fill="#888">Single source of truth for all patient data</text>
</svg>
