<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 880" width="1600" height="880" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1600" height="880" fill="#FFFFFF"/>

  <defs>
    <linearGradient id="oldChan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7F8C8D"/><stop offset="100%" stop-color="#566573"/>
    </linearGradient>
    <linearGradient id="newChan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F4E79"/><stop offset="100%" stop-color="#0F2538"/>
    </linearGradient>
    <linearGradient id="newDisk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16A085"/><stop offset="100%" stop-color="#0E6251"/>
    </linearGradient>
    <linearGradient id="newCase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B2C6F"/><stop offset="100%" stop-color="#34174A"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.18"/></filter>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6">
      <path d="M-1,1 l2,-2 M0,6 l6,-6 M5,7 l2,-2" stroke="#BDC3C7" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F4E79"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="800" y="44" text-anchor="middle" font-size="30" font-weight="bold" fill="#1B3A5C">
    Old Memory  vs.  New Memory
  </text>
  <text x="800" y="74" text-anchor="middle" font-size="16" font-style="italic" fill="#5D6D7E">
    Same LangGraph state — every channel now load-bearing, plus three new layers above and beyond
  </text>

  <!-- ──────────────────  LEFT: OLD  ────────────────── -->
  <rect x="40" y="100" width="730" height="740" rx="14" fill="#F4F6F7" stroke="#7F8C8D" stroke-width="1.5"/>

  <text x="60"  y="138" font-size="22" font-weight="bold" fill="#34495E">BEFORE  ·  PipelineState only</text>
  <text x="60"  y="164" font-size="14" fill="#5D6D7E" font-style="italic">5 TypedDict channels, 3 actually used. No cross-session state, no reasoning trail.</text>

  <!-- old shared state container -->
  <rect x="60" y="190" width="690" height="270" rx="10" fill="#FFFFFF" stroke="#AAB7C4" stroke-width="1.4"/>
  <text x="80" y="220" font-size="16" font-weight="bold" fill="#34495E">PipelineState  (TypedDict)</text>
  <text x="80" y="240" font-size="13" fill="#7F8C8D" font-style="italic">defined in src/orchestrator/state.py</text>

  <g font-size="14">
    <rect x="80"  y="252" width="640" height="36" rx="6" fill="url(#oldChan)" filter="url(#shadow)"/>
    <text x="100" y="276" fill="#FFF" font-weight="bold">patient_context</text>
    <text x="280" y="276" fill="#ECF0F1">— Gold-layer EHR + lab data, set once</text>
    <text x="700" y="276" text-anchor="end" fill="#FFF" font-style="italic">used</text>

    <rect x="80"  y="292" width="640" height="36" rx="6" fill="url(#oldChan)" filter="url(#shadow)"/>
    <text x="100" y="316" fill="#FFF" font-weight="bold">agent_outputs</text>
    <text x="280" y="316" fill="#ECF0F1">— per-agent JSON slot, merge reducer</text>
    <text x="700" y="316" text-anchor="end" fill="#FFF" font-style="italic">used</text>

    <rect x="80"  y="332" width="640" height="36" rx="6" fill="url(#oldChan)" filter="url(#shadow)"/>
    <text x="100" y="356" fill="#FFF" font-weight="bold">execution_trace</text>
    <text x="280" y="356" fill="#ECF0F1">— append-only status / timing record</text>
    <text x="700" y="356" text-anchor="end" fill="#FFF" font-style="italic">used</text>

    <rect x="80"  y="372" width="640" height="36" rx="6" fill="url(#hatch)" stroke="#BDC3C7"/>
    <text x="100" y="396" fill="#7F8C8D" font-weight="bold">conflicts</text>
    <text x="280" y="396" fill="#95A5A6">— append-only list, never written</text>
    <text x="700" y="396" text-anchor="end" fill="#7F8C8D" font-style="italic">vestigial</text>

    <rect x="80"  y="412" width="640" height="36" rx="6" fill="url(#hatch)" stroke="#BDC3C7"/>
    <text x="100" y="436" fill="#7F8C8D" font-weight="bold">scratchpad</text>
    <text x="280" y="436" fill="#95A5A6">— per-agent notes, never written</text>
    <text x="700" y="436" text-anchor="end" fill="#7F8C8D" font-style="italic">vestigial</text>
  </g>

  <!-- old "what's missing" -->
  <rect x="60" y="478" width="690" height="338" rx="10" fill="#FDEDEC" stroke="#C0392B" stroke-width="1.4"/>
  <text x="80" y="510" font-size="17" font-weight="bold" fill="#922B21">WHAT THE OLD DESIGN HID</text>

  <g font-size="14" fill="#34495E">
    <text x="80"  y="544">✗  Reviewer saw only the final differential JSON —</text>
    <text x="100" y="566">no critique rounds, no confidence trajectory, no rejected hypotheses.</text>

    <text x="80"  y="600">✗  Refiner had no view of the reasoning chain —</text>
    <text x="100" y="622">it could only weigh two opaque outputs.</text>

    <text x="80"  y="656">✗  Each patient run was completely isolated —</text>
    <text x="100" y="678">no signal flowed from one run to the next.</text>

    <text x="80"  y="712">✗  No cross-disease aggregate priors  ·  no case-similarity recall —</text>
    <text x="100" y="734">the diagnostic agent re-learnt every disease from scratch each run.</text>

    <text x="80"  y="768">✗  scratchpad and conflicts were declared but never used —</text>
    <text x="100" y="790">the placeholder shape of a memory system without the substance.</text>
  </g>

  <!-- ──────────────────  RIGHT: NEW  ────────────────── -->
  <rect x="790" y="100" width="770" height="740" rx="14" fill="#F4FAFD" stroke="#1F4E79" stroke-width="1.5"/>

  <text x="810" y="138" font-size="22" font-weight="bold" fill="#1F4E79">AFTER  ·  PipelineState + 4-tier memory</text>
  <text x="810" y="164" font-size="14" fill="#1B3A5C" font-style="italic">All five channels active + 2 new channels + Tier-3 disk store + Tier-4 vector store.</text>

  <!-- new state container -->
  <rect x="810" y="190" width="730" height="296" rx="10" fill="#FFFFFF" stroke="#5499C7" stroke-width="1.4"/>
  <text x="830" y="220" font-size="16" font-weight="bold" fill="#1F4E79">PipelineState  (extended)</text>
  <text x="830" y="240" font-size="13" fill="#5D6D7E" font-style="italic">+ session_memory  + session_summary  ·  scratchpad now load-bearing</text>

  <g font-size="14">
    <rect x="830" y="252" width="690" height="34" rx="6" fill="url(#newChan)" filter="url(#shadow)"/>
    <text x="850" y="274" fill="#FFF" font-weight="bold">patient_context · agent_outputs · execution_trace</text>
    <text x="1500" y="274" text-anchor="end" fill="#D6EAF8" font-style="italic">unchanged</text>

    <rect x="830" y="290" width="690" height="34" rx="6" fill="#FDF2E9" stroke="#D35400" stroke-width="1.5"/>
    <text x="850" y="312" fill="#A04000" font-weight="bold">scratchpad[agent_id]</text>
    <text x="1010" y="312" fill="#7E430B">— now Tier-1 working memory  (was unused)</text>
    <text x="1500" y="312" text-anchor="end" fill="#A04000" font-style="italic">activated</text>

    <rect x="830" y="328" width="690" height="34" rx="6" fill="#EAF4FB" stroke="#1F4E79" stroke-width="1.5"/>
    <text x="850" y="350" fill="#1F4E79" font-weight="bold">session_memory</text>
    <text x="1010" y="350" fill="#1B3A5C">— Tier-2 episodic timeline  (NEW · append reducer)</text>
    <text x="1500" y="350" text-anchor="end" fill="#1F4E79" font-style="italic">new</text>

    <rect x="830" y="366" width="690" height="34" rx="6" fill="#EAF4FB" stroke="#1F4E79" stroke-width="1.5"/>
    <text x="850" y="388" fill="#1F4E79" font-weight="bold">session_summary</text>
    <text x="1010" y="388" fill="#1B3A5C">— Tier-2 per-agent digest  (NEW · merge reducer)</text>
    <text x="1500" y="388" text-anchor="end" fill="#1F4E79" font-style="italic">new</text>

    <rect x="830" y="404" width="690" height="34" rx="6" fill="url(#hatch)" stroke="#BDC3C7"/>
    <text x="850" y="426" fill="#7F8C8D" font-weight="bold">conflicts</text>
    <text x="1000" y="426" fill="#95A5A6">— still unused (kept for forward compatibility)</text>
    <text x="1500" y="426" text-anchor="end" fill="#7F8C8D" font-style="italic">reserved</text>
  </g>

  <text x="830" y="470" font-size="13" font-style="italic" fill="#5D6D7E">Tier-3 and Tier-4 stores live outside the state — see below.</text>

  <!-- Tier 3 -->
  <rect x="810" y="498" width="730" height="110" rx="10" fill="#FFFFFF" stroke="#0E6251" stroke-width="1.4"/>
  <rect x="810" y="498" width="730" height="40" rx="10" fill="url(#newDisk)"/>
  <rect x="810" y="522" width="730" height="16" fill="url(#newDisk)"/>
  <text x="830" y="525" font-size="16" font-weight="bold" fill="#FFF">TIER 3  ·  SEMANTIC MEMORY (cross-session, on disk)</text>
  <text x="830" y="566" font-size="14" fill="#34495E">data/gold/memory/semantic_memory.json — per-disease aggregate stats.</text>
  <text x="830" y="586" font-size="13" fill="#5D6D7E" font-style="italic">Updated by Stage-7 memory_consolidation_node after every run. Recallable by name (O(1)).</text>

  <!-- Tier 4 (NEW) -->
  <rect x="810" y="618" width="730" height="118" rx="10" fill="#FFFFFF" stroke="#5B2C6F" stroke-width="1.4"/>
  <rect x="810" y="618" width="730" height="40" rx="10" fill="url(#newCase)"/>
  <rect x="810" y="642" width="730" height="16" fill="url(#newCase)"/>
  <text x="830" y="645" font-size="16" font-weight="bold" fill="#FFF">TIER 4  ·  CASE-BASED MEMORY (cross-session, Qdrant — new collection)</text>
  <text x="830" y="686" font-size="14" fill="#34495E">Qdrant <tspan font-weight="700">patient_cases</tspan> — embed each finished patient (demographics + conditions + meds + labs)</text>
  <text x="830" y="706" font-size="14" fill="#34495E">with the run's outcome.  Diagnostic queries top-K similar past patients as a Bayesian-style prior.</text>
  <text x="830" y="726" font-size="13" fill="#5D6D7E" font-style="italic">BioLORD-2023 embeddings · cosine distance · graceful degradation if Qdrant is unreachable.</text>

  <!-- NICE guidelines as external knowledge (not memory) -->
  <rect x="810" y="746" width="730" height="58" rx="10" fill="#FAF5FC" stroke="#C39BD3" stroke-width="1.2"/>
  <text x="830" y="770" font-size="14" font-weight="700" fill="#76448A">External knowledge base  ·  not a memory tier</text>
  <text x="830" y="792" font-size="13" fill="#34495E">
    NICE clinical guidelines stay in Qdrant <tspan font-weight="700">nice_guidelines</tspan> — used by Treatment for drug lookup. Static; doesn't accumulate.
  </text>

  <!-- result -->
  <rect x="810" y="814" width="730" height="22" rx="6" fill="#FEF9E7" stroke="#D4AC0D" stroke-width="1"/>
  <text x="830" y="831" font-size="13" fill="#34495E">
    <tspan font-weight="700" fill="#7D6608">RESULT  ·</tspan>  +5 pp DIRECT, +10 pp Found-rate on Batch 4 · 35 unit tests · MEMORY_ENABLED flag
  </text>

  <!-- arrow connector between OLD and NEW -->
  <g stroke="#1F4E79" stroke-width="2.5" fill="none">
    <path d="M 770 470 L 790 470" marker-end="url(#arrow)"/>
  </g>
</svg>
