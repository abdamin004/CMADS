<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 880" width="1600" height="880" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1600" height="880" fill="#FFFFFF"/>

  <defs>
    <linearGradient id="gT1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D35400"/><stop offset="100%" stop-color="#A04000"/>
    </linearGradient>
    <linearGradient id="gT2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2980B9"/><stop offset="100%" stop-color="#1B5E7B"/>
    </linearGradient>
    <linearGradient id="gT3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16A085"/><stop offset="100%" stop-color="#0E6251"/>
    </linearGradient>
    <linearGradient id="gT4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B2C6F"/><stop offset="100%" stop-color="#34174A"/>
    </linearGradient>
    <linearGradient id="gFacade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8E44AD"/><stop offset="100%" stop-color="#5B2C6F"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.18"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2C3E50"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7F8C8D"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="800" y="44" text-anchor="middle" font-size="30" font-weight="bold" fill="#1B3A5C">
    Multi-Level Memory — Four Tiers Layered on the LangGraph State
  </text>
  <text x="800" y="74" text-anchor="middle" font-size="16" font-style="italic" fill="#5D6D7E">
    CoALA-inspired  ·  one MemoryManager facade  ·  gated by MEMORY_ENABLED
  </text>

  <!-- ── Agents row (top) ── -->
  <rect x="40" y="100" width="1520" height="92" rx="10" fill="#EAF4FB" stroke="#5499C7" stroke-width="1.5"/>
  <text x="60" y="128" font-size="16" font-weight="bold" fill="#1F4E79">CMADS AGENTS · 7 specialised + 1 maintenance node</text>

  <g font-size="14" font-weight="600" fill="#1B3A5C" text-anchor="middle">
    <rect x="60"   y="144" width="160" height="38" rx="6" fill="#FFF" stroke="#5499C7"/>
    <text x="140"  y="168">EHR Analyst</text>
    <rect x="240"  y="144" width="160" height="38" rx="6" fill="#FFF" stroke="#5499C7"/>
    <text x="320"  y="168">Lab Interpreter</text>
    <rect x="420"  y="144" width="180" height="38" rx="6" fill="#FFF" stroke="#5499C7"/>
    <text x="510"  y="168">Diagnostic Reasoning</text>
    <rect x="620"  y="144" width="160" height="38" rx="6" fill="#FFF" stroke="#5499C7"/>
    <text x="700"  y="168">Clinical Reviewer</text>
    <rect x="800"  y="144" width="140" height="38" rx="6" fill="#FFF" stroke="#5499C7"/>
    <text x="870"  y="168">Refiner</text>
    <rect x="960"  y="144" width="140" height="38" rx="6" fill="#FFF" stroke="#5499C7"/>
    <text x="1030" y="168">Evaluator</text>
    <rect x="1120" y="144" width="140" height="38" rx="6" fill="#FFF" stroke="#5499C7"/>
    <text x="1190" y="168">Treatment</text>
    <rect x="1280" y="144" width="240" height="38" rx="6" fill="#FDF2E9" stroke="#D35400" stroke-width="1.4"/>
    <text x="1400" y="168" fill="#A04000">Memory Consolidation (NEW · S7)</text>
  </g>

  <!-- ── MemoryManager facade ── -->
  <rect x="40" y="208" width="1520" height="72" rx="10" fill="url(#gFacade)" filter="url(#shadow)"/>
  <text x="60" y="238" font-size="17" font-weight="bold" fill="#FFF">MemoryManager  ·  facade</text>
  <text x="60" y="260" font-size="14" fill="#F5EEF8">mm.working.put(...)  ·  mm.episodic.summarize()  ·  mm.semantic.recall(disease)  ·  mm.case_based.recall(patient_context)</text>
  <text x="1540" y="238" text-anchor="end" font-size="14" font-weight="600" fill="#FFF">one entry point</text>
  <text x="1540" y="260" text-anchor="end" font-size="13" fill="#F5EEF8">deterministic recall  ·  T4 uses BioLORD embeddings</text>

  <!-- read/write connectors from agents to facade -->
  <g stroke="#8E44AD" stroke-width="1.6" fill="none" marker-end="url(#arrowDashed)">
    <path d="M 140 182 L 140 208"/>
    <path d="M 320 182 L 320 208"/>
    <path d="M 510 182 L 510 208"/>
    <path d="M 700 182 L 700 208"/>
    <path d="M 870 182 L 870 208"/>
    <path d="M 1030 182 L 1030 208"/>
    <path d="M 1190 182 L 1190 208"/>
    <path d="M 1400 182 L 1400 208"/>
  </g>

  <!-- arrows from facade down into tiers -->
  <g stroke="#5B2C6F" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <path d="M 220 280 L 220 326"/>
    <path d="M 605 280 L 605 326"/>
    <path d="M 990 280 L 990 326"/>
    <path d="M 1375 280 L 1375 326"/>
  </g>

  <!-- ─────────────────────────────────────────── -->
  <!-- TIER CARDS                                 -->
  <!-- ─────────────────────────────────────────── -->

  <!-- Tier 1 · Working -->
  <rect x="40"  y="330" width="370" height="370" rx="12" fill="#FDF2E9" stroke="#D35400" stroke-width="1.5"/>
  <rect x="40"  y="330" width="370" height="76"  rx="12" fill="url(#gT1)"/>
  <rect x="40"  y="390" width="370" height="16"  fill="url(#gT1)"/>
  <text x="205" y="362" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFF">TIER 1 · WORKING MEMORY</text>
  <text x="205" y="386" text-anchor="middle" font-size="13" fill="#FDEBD0" font-style="italic">per-agent · invocation-local</text>

  <text x="58"  y="416" font-size="14" font-weight="700" fill="#A04000">WHERE</text>
  <text x="58"  y="438" font-size="14" fill="#5D2E04">state.scratchpad[agent_id]</text>
  <text x="58"  y="458" font-size="13" fill="#7E430B" font-style="italic">(in-state · transient)</text>

  <text x="58"  y="492" font-size="14" font-weight="700" fill="#A04000">PURPOSE</text>
  <text x="58"  y="514" font-size="14" fill="#34495E">Scratch space inside one</text>
  <text x="58"  y="534" font-size="14" fill="#34495E">agent invocation. Tracks the</text>
  <text x="58"  y="554" font-size="14" fill="#34495E">Diagnostic agent's confidence</text>
  <text x="58"  y="574" font-size="14" fill="#34495E">trajectory and critique trail</text>
  <text x="58"  y="594" font-size="14" fill="#34495E">across multi-round reasoning.</text>

  <text x="58"  y="628" font-size="13" font-weight="700" fill="#A04000">EXAMPLE</text>
  <rect x="50"  y="638" width="350" height="56" rx="6" fill="#FFFFFF" stroke="#F5CBA7"/>
  <text x="62"  y="658" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#34495E">mm.working.put(</text>
  <text x="62"  y="676" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#34495E">  "confidence_trajectory",</text>
  <text x="62"  y="688" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#34495E">  [60, 72, 78])</text>

  <!-- Tier 2 · Episodic -->
  <rect x="425" y="330" width="370" height="370" rx="12" fill="#EAF4FB" stroke="#1F4E79" stroke-width="1.5"/>
  <rect x="425" y="330" width="370" height="76"  rx="12" fill="url(#gT2)"/>
  <rect x="425" y="390" width="370" height="16"  fill="url(#gT2)"/>
  <text x="610" y="362" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFF">TIER 2 · EPISODIC MEMORY</text>
  <text x="610" y="386" text-anchor="middle" font-size="13" fill="#D6EAF8" font-style="italic">current run · in-state, persisted</text>

  <text x="443" y="416" font-size="14" font-weight="700" fill="#1F4E79">WHERE</text>
  <text x="443" y="438" font-size="14" fill="#0F2538">state.session_memory (append)</text>
  <text x="443" y="458" font-size="13" fill="#1B3A5C" font-style="italic">→ session_memory.json on disk</text>

  <text x="443" y="492" font-size="14" font-weight="700" fill="#1F4E79">PURPOSE</text>
  <text x="443" y="514" font-size="14" fill="#34495E">Typed timeline of decisions,</text>
  <text x="443" y="534" font-size="14" fill="#34495E">critiques, confidence checks.</text>
  <text x="443" y="554" font-size="14" fill="#34495E">Reviewer + Refiner read the</text>
  <text x="443" y="574" font-size="14" fill="#34495E">reasoning chain — not just the</text>
  <text x="443" y="594" font-size="14" fill="#34495E">final structured output.</text>

  <text x="443" y="628" font-size="13" font-weight="700" fill="#1F4E79">EXAMPLE</text>
  <rect x="435" y="638" width="350" height="56" rx="6" fill="#FFFFFF" stroke="#A9CCE3"/>
  <text x="447" y="658" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#34495E">{event_type: "critique",</text>
  <text x="447" y="676" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#34495E"> agent: "diagnostic", round:2,</text>
  <text x="447" y="688" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#34495E"> confidence: 78}</text>

  <!-- Tier 3 · Semantic -->
  <rect x="810" y="330" width="370" height="370" rx="12" fill="#E8F8F5" stroke="#0E6251" stroke-width="1.5"/>
  <rect x="810" y="330" width="370" height="76"  rx="12" fill="url(#gT3)"/>
  <rect x="810" y="390" width="370" height="16"  fill="url(#gT3)"/>
  <text x="995" y="362" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFF">TIER 3 · SEMANTIC MEMORY</text>
  <text x="995" y="386" text-anchor="middle" font-size="13" fill="#D1F2EB" font-style="italic">cross-session · on disk</text>

  <text x="828" y="416" font-size="14" font-weight="700" fill="#0E6251">WHERE</text>
  <text x="828" y="438" font-size="14" fill="#0B3D2E">data/gold/memory/</text>
  <text x="828" y="456" font-size="14" fill="#0B3D2E">  semantic_memory.json</text>
  <text x="828" y="474" font-size="13" fill="#117A65" font-style="italic">(JSON keyed by disease name)</text>

  <text x="828" y="508" font-size="14" font-weight="700" fill="#0E6251">PURPOSE</text>
  <text x="828" y="530" font-size="14" fill="#34495E">Per-disease aggregate stats —</text>
  <text x="828" y="550" font-size="14" fill="#34495E">DIRECT/INDIRECT/MISS counts,</text>
  <text x="828" y="570" font-size="14" fill="#34495E">rank-1 frequency, observed</text>
  <text x="828" y="590" font-size="14" fill="#34495E">evidence patterns. Updated</text>
  <text x="828" y="610" font-size="14" fill="#34495E">by Stage 7 consolidation node.</text>

  <text x="828" y="640" font-size="13" font-weight="700" fill="#0E6251">EXAMPLE</text>
  <rect x="820" y="650" width="350" height="56" rx="6" fill="#FFFFFF" stroke="#A2D9CE"/>
  <text x="832" y="668" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#34495E">{"Hypertension": {</text>
  <text x="832" y="684" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#34495E"> runs:14, direct:9, rank1:7,</text>
  <text x="832" y="700" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#34495E"> avg_confidence: 81.2}}</text>

  <!-- Tier 4 · Case-Based (NEW) -->
  <rect x="1195" y="330" width="365" height="370" rx="12" fill="#F5EEF8" stroke="#5B2C6F" stroke-width="1.5"/>
  <rect x="1195" y="330" width="365" height="76"  rx="12" fill="url(#gT4)"/>
  <rect x="1195" y="390" width="365" height="16"  fill="url(#gT4)"/>
  <text x="1377" y="362" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFF">TIER 4 · CASE-BASED MEMORY</text>
  <text x="1377" y="386" text-anchor="middle" font-size="13" fill="#E8DAEF" font-style="italic">cross-session · vector recall</text>

  <text x="1213" y="416" font-size="14" font-weight="700" fill="#5B2C6F">WHERE</text>
  <text x="1213" y="438" font-size="14" fill="#34174A">Qdrant collection</text>
  <text x="1213" y="456" font-size="14" fill="#34174A">  "patient_cases"</text>
  <text x="1213" y="474" font-size="13" fill="#76448A" font-style="italic">(BioLORD embeddings · cosine)</text>

  <text x="1213" y="508" font-size="14" font-weight="700" fill="#5B2C6F">PURPOSE</text>
  <text x="1213" y="530" font-size="14" fill="#34495E">Past patient cases — embed</text>
  <text x="1213" y="550" font-size="14" fill="#34495E">demographics + conditions +</text>
  <text x="1213" y="570" font-size="14" fill="#34495E">meds + key labs as a vector.</text>
  <text x="1213" y="590" font-size="14" fill="#34495E">Diagnostic agent retrieves</text>
  <text x="1213" y="610" font-size="14" fill="#34495E">top-K similar past patients.</text>

  <text x="1213" y="640" font-size="13" font-weight="700" fill="#5B2C6F">EXAMPLE</text>
  <rect x="1205" y="650" width="350" height="56" rx="6" fill="#FFFFFF" stroke="#D2B4DE"/>
  <text x="1217" y="668" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#34495E">mm.case_based.recall(</text>
  <text x="1217" y="684" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#34495E">  patient_context, top_k=5)</text>
  <text x="1217" y="700" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#34495E">→ [{dx:"HTN", DIRECT, score:0.91}…]</text>

  <!-- ── Note about NICE ── -->
  <rect x="40" y="710" width="1520" height="50" rx="10" fill="#FAF5FC" stroke="#C39BD3" stroke-width="1"/>
  <text x="60" y="734" font-size="14" font-weight="700" fill="#76448A">EXTERNAL KNOWLEDGE BASE  (not a memory tier)</text>
  <text x="60" y="752" font-size="13.5" fill="#34495E">
    NICE clinical guidelines stay in Qdrant collection "nice_guidelines" — used by Treatment for drug + contraindication lookup. Reference knowledge, not memory.
  </text>

  <!-- ── Bottom band — scope axis ── -->
  <rect x="40" y="772" width="1520" height="56" rx="10" fill="#F4F6F7" stroke="#AAB7C4" stroke-width="1"/>
  <text x="60"  y="794" font-size="14" font-weight="700" fill="#34495E">SCOPE  ─→  longer lifespan, broader reuse</text>
  <line x1="60" y1="814" x2="1540" y2="814" stroke="#7F8C8D" stroke-width="1.6" marker-end="url(#arrowDashed)"/>
  <g font-size="13" fill="#5D6D7E" text-anchor="middle">
    <text x="225" y="832">one LLM call</text>
    <text x="610" y="832">one patient run</text>
    <text x="995" y="832">disease-level aggregates</text>
    <text x="1378" y="832">case-similarity (vector)</text>
  </g>

  <!-- ── Footer — what changed ── -->
  <rect x="40" y="838" width="1520" height="38" rx="10" fill="#FEF9E7" stroke="#D4AC0D" stroke-width="1"/>
  <text x="60" y="862" font-size="13.5" fill="#34495E">
    <tspan font-weight="700" fill="#7D6608">WHY IT MATTERS  ·</tspan>  Reviewer cites Diagnostic critique rounds  ·  Refiner reads cross-session priors  ·  Diagnostic queries similar past patients  ·  next run inherits this run's outcome
  </text>
</svg>
