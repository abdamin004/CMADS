<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" width="1600" height="760" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1600" height="760" fill="#FFFFFF"/>

  <defs>
    <linearGradient id="gT1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D35400"/><stop offset="100%" stop-color="#A04000"/>
    </linearGradient>
    <linearGradient id="gT2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2980B9"/><stop offset="100%" stop-color="#1B5E7B"/>
    </linearGradient>
    <linearGradient id="gT3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16A085"/><stop offset="100%" stop-color="#0E6251"/>
    </linearGradient>
    <linearGradient id="gT4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B3A5C"/><stop offset="100%" stop-color="#0F2538"/>
    </linearGradient>
    <linearGradient id="gFacade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8E44AD"/><stop offset="100%" stop-color="#5B2C6F"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.18"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2C3E50"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7F8C8D"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="800" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1B3A5C">
    Multi-Level Memory — Four Tiers Layered on the LangGraph State
  </text>
  <text x="800" y="56" text-anchor="middle" font-size="12" font-style="italic" fill="#666">
    CoALA-inspired · accessed through one MemoryManager facade · gated by MEMORY_ENABLED
  </text>

  <!-- ── Agents row (top) ── -->
  <rect x="40" y="80" width="1520" height="76" rx="10" fill="#EAF4FB" stroke="#5499C7" stroke-width="1.3"/>
  <text x="60" y="103" font-size="12" font-weight="bold" fill="#1F4E79">CMADS AGENTS · 7 specialised + 1 maintenance node</text>

  <g font-size="10.5" font-weight="600" fill="#1B3A5C" text-anchor="middle">
    <rect x="60"   y="115" width="160" height="32" rx="6" fill="#FFF" stroke="#5499C7"/>
    <text x="140"  y="135">EHR Analyst</text>
    <rect x="240"  y="115" width="160" height="32" rx="6" fill="#FFF" stroke="#5499C7"/>
    <text x="320"  y="135">Lab Interpreter</text>
    <rect x="420"  y="115" width="170" height="32" rx="6" fill="#FFF" stroke="#5499C7"/>
    <text x="505"  y="135">Diagnostic Reasoning</text>
    <rect x="610"  y="115" width="160" height="32" rx="6" fill="#FFF" stroke="#5499C7"/>
    <text x="690"  y="135">Clinical Reviewer</text>
    <rect x="790"  y="115" width="150" height="32" rx="6" fill="#FFF" stroke="#5499C7"/>
    <text x="865"  y="135">Refiner</text>
    <rect x="960"  y="115" width="140" height="32" rx="6" fill="#FFF" stroke="#5499C7"/>
    <text x="1030" y="135">Evaluator</text>
    <rect x="1120" y="115" width="160" height="32" rx="6" fill="#FFF" stroke="#5499C7"/>
    <text x="1200" y="135">Treatment</text>
    <rect x="1300" y="115" width="220" height="32" rx="6" fill="#FDF2E9" stroke="#D35400"/>
    <text x="1410" y="135" fill="#A04000">Memory Consolidation (NEW · S7)</text>
  </g>

  <!-- ── MemoryManager facade ── -->
  <rect x="40" y="186" width="1520" height="58" rx="10" fill="url(#gFacade)" filter="url(#shadow)"/>
  <text x="60" y="208" font-size="12" font-weight="bold" fill="#FFF">MemoryManager  ·  facade</text>
  <text x="60" y="226" font-size="10.5" fill="#F5EEF8">mm.working.put(...) · mm.episodic.summarize() · mm.semantic.recall(disease) · mm.procedural.lookup_disease(disease)</text>
  <text x="1540" y="208" text-anchor="end" font-size="11" font-weight="600" fill="#FFF">one entry point</text>
  <text x="1540" y="226" text-anchor="end" font-size="10" fill="#F5EEF8">no LLM coupling — fast, deterministic recall</text>

  <!-- read/write connectors from agents to facade -->
  <g stroke="#8E44AD" stroke-width="1.4" fill="none" marker-end="url(#arrowDashed)">
    <path d="M 140 147 L 140 186"/>
    <path d="M 320 147 L 320 186"/>
    <path d="M 505 147 L 505 186"/>
    <path d="M 690 147 L 690 186"/>
    <path d="M 865 147 L 865 186"/>
    <path d="M 1030 147 L 1030 186"/>
    <path d="M 1200 147 L 1200 186"/>
    <path d="M 1410 147 L 1410 186"/>
  </g>

  <!-- arrows from facade down into tiers -->
  <g stroke="#5B2C6F" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M 220 244 L 220 286"/>
    <path d="M 605 244 L 605 286"/>
    <path d="M 990 244 L 990 286"/>
    <path d="M 1375 244 L 1375 286"/>
  </g>

  <!-- ─────────────────────────────────────────── -->
  <!-- TIER CARDS                                 -->
  <!-- ─────────────────────────────────────────── -->

  <!-- Tier 1 · Working -->
  <rect x="40"  y="290" width="370" height="280" rx="12" fill="#FDF2E9" stroke="#D35400" stroke-width="1.5"/>
  <rect x="40"  y="290" width="370" height="42"  rx="12" fill="url(#gT1)"/>
  <rect x="40"  y="320" width="370" height="12"  fill="url(#gT1)"/>
  <text x="58"  y="316" font-size="13" font-weight="bold" fill="#FFF">TIER 1 · WORKING MEMORY</text>
  <text x="392" y="316" text-anchor="end" font-size="10" fill="#FDEBD0" font-style="italic">per-agent · invocation-local</text>

  <text x="58"  y="358" font-size="10.5" font-weight="600" fill="#A04000">WHERE</text>
  <text x="58"  y="375" font-size="10.5" fill="#5D2E04">state.scratchpad[agent_id]</text>
  <text x="58"  y="394" font-size="10" fill="#7E430B" font-style="italic">(in-state · transient)</text>

  <text x="58"  y="424" font-size="10.5" font-weight="600" fill="#A04000">PURPOSE</text>
  <text x="58"  y="442" font-size="11" fill="#34495E">Scratch space inside one</text>
  <text x="58"  y="458" font-size="11" fill="#34495E">agent invocation. Tracks the</text>
  <text x="58"  y="474" font-size="11" fill="#34495E">Diagnostic agent's confidence</text>
  <text x="58"  y="490" font-size="11" fill="#34495E">trajectory and critique trail</text>
  <text x="58"  y="506" font-size="11" fill="#34495E">across multi-round reasoning.</text>

  <text x="58"  y="534" font-size="10" font-weight="600" fill="#A04000">EXAMPLE</text>
  <text x="58"  y="551" font-size="10" font-family="Menlo, Consolas, monospace" fill="#34495E">mm.working.put(</text>
  <text x="58"  y="565" font-size="10" font-family="Menlo, Consolas, monospace" fill="#34495E">  "confidence_trajectory",</text>
  <text x="58"  y="579" font-size="10" font-family="Menlo, Consolas, monospace" fill="#34495E">  [60, 72, 78])</text>

  <!-- Tier 2 · Episodic -->
  <rect x="425" y="290" width="370" height="280" rx="12" fill="#EAF4FB" stroke="#1F4E79" stroke-width="1.5"/>
  <rect x="425" y="290" width="370" height="42"  rx="12" fill="url(#gT2)"/>
  <rect x="425" y="320" width="370" height="12"  fill="url(#gT2)"/>
  <text x="443" y="316" font-size="13" font-weight="bold" fill="#FFF">TIER 2 · EPISODIC MEMORY</text>
  <text x="777" y="316" text-anchor="end" font-size="10" fill="#D6EAF8" font-style="italic">current run · in-state, persisted</text>

  <text x="443" y="358" font-size="10.5" font-weight="600" fill="#1F4E79">WHERE</text>
  <text x="443" y="375" font-size="10.5" fill="#0F2538">state.session_memory (append)</text>
  <text x="443" y="394" font-size="10" fill="#1B3A5C" font-style="italic">→ session_memory.json on disk</text>

  <text x="443" y="424" font-size="10.5" font-weight="600" fill="#1F4E79">PURPOSE</text>
  <text x="443" y="442" font-size="11" fill="#34495E">Typed timeline of decisions,</text>
  <text x="443" y="458" font-size="11" fill="#34495E">critiques, confidence checks.</text>
  <text x="443" y="474" font-size="11" fill="#34495E">Reviewer + Refiner read the</text>
  <text x="443" y="490" font-size="11" fill="#34495E">reasoning chain — not just the</text>
  <text x="443" y="506" font-size="11" fill="#34495E">final structured output.</text>

  <text x="443" y="534" font-size="10" font-weight="600" fill="#1F4E79">EXAMPLE</text>
  <text x="443" y="551" font-size="10" font-family="Menlo, Consolas, monospace" fill="#34495E">{event_type: "critique",</text>
  <text x="443" y="565" font-size="10" font-family="Menlo, Consolas, monospace" fill="#34495E"> agent: "diagnostic", round:2,</text>
  <text x="443" y="579" font-size="10" font-family="Menlo, Consolas, monospace" fill="#34495E"> confidence: 78}</text>

  <!-- Tier 3 · Semantic -->
  <rect x="810" y="290" width="370" height="280" rx="12" fill="#E8F8F5" stroke="#0E6251" stroke-width="1.5"/>
  <rect x="810" y="290" width="370" height="42"  rx="12" fill="url(#gT3)"/>
  <rect x="810" y="320" width="370" height="12"  fill="url(#gT3)"/>
  <text x="828" y="316" font-size="13" font-weight="bold" fill="#FFF">TIER 3 · SEMANTIC MEMORY</text>
  <text x="1162" y="316" text-anchor="end" font-size="10" fill="#D1F2EB" font-style="italic">cross-session · on disk</text>

  <text x="828" y="358" font-size="10.5" font-weight="600" fill="#0E6251">WHERE</text>
  <text x="828" y="375" font-size="10.5" fill="#0B3D2E">data/gold/memory/</text>
  <text x="828" y="389" font-size="10.5" fill="#0B3D2E">  semantic_memory.json</text>
  <text x="828" y="406" font-size="10" fill="#117A65" font-style="italic">(JSON keyed by disease name)</text>

  <text x="828" y="434" font-size="10.5" font-weight="600" fill="#0E6251">PURPOSE</text>
  <text x="828" y="452" font-size="11" fill="#34495E">Per-disease aggregate stats:</text>
  <text x="828" y="468" font-size="11" fill="#34495E">DIRECT/INDIRECT/MISS counts,</text>
  <text x="828" y="484" font-size="11" fill="#34495E">rank-1 frequency, observed</text>
  <text x="828" y="500" font-size="11" fill="#34495E">evidence patterns. Updated by</text>
  <text x="828" y="516" font-size="11" fill="#34495E">Stage 7 consolidation node.</text>

  <text x="828" y="540" font-size="10" font-weight="600" fill="#0E6251">EXAMPLE</text>
  <text x="828" y="557" font-size="10" font-family="Menlo, Consolas, monospace" fill="#34495E">{"Hypertension": {</text>
  <text x="828" y="571" font-size="10" font-family="Menlo, Consolas, monospace" fill="#34495E"> runs:14, direct:9,rank1:7,</text>
  <text x="828" y="585" font-size="10" font-family="Menlo, Consolas, monospace" fill="#34495E"> avg_confidence: 81.2}}</text>

  <!-- Tier 4 · Procedural -->
  <rect x="1195" y="290" width="365" height="280" rx="12" fill="#EBF5FB" stroke="#1B3A5C" stroke-width="1.5"/>
  <rect x="1195" y="290" width="365" height="42"  rx="12" fill="url(#gT4)"/>
  <rect x="1195" y="320" width="365" height="12"  fill="url(#gT4)"/>
  <text x="1213" y="316" font-size="13" font-weight="bold" fill="#FFF">TIER 4 · PROCEDURAL MEMORY</text>
  <text x="1542" y="316" text-anchor="end" font-size="10" fill="#D6EAF8" font-style="italic">long-term · static</text>

  <text x="1213" y="358" font-size="10.5" font-weight="600" fill="#1B3A5C">WHERE</text>
  <text x="1213" y="375" font-size="10.5" fill="#0F2538">Qdrant collection</text>
  <text x="1213" y="389" font-size="10.5" fill="#0F2538">  "nice_guidelines"</text>
  <text x="1213" y="406" font-size="10" fill="#283747" font-style="italic">(pre-existing, now wrapped)</text>

  <text x="1213" y="434" font-size="10.5" font-weight="600" fill="#1B3A5C">PURPOSE</text>
  <text x="1213" y="452" font-size="11" fill="#34495E">NICE clinical guidelines —</text>
  <text x="1213" y="468" font-size="11" fill="#34495E">drug recommendations,</text>
  <text x="1213" y="484" font-size="11" fill="#34495E">contraindications, monitoring.</text>
  <text x="1213" y="500" font-size="11" fill="#34495E">Now exposed via the same</text>
  <text x="1213" y="516" font-size="11" fill="#34495E">recall(query) API as the rest.</text>

  <text x="1213" y="540" font-size="10" font-weight="600" fill="#1B3A5C">EXAMPLE</text>
  <text x="1213" y="557" font-size="10" font-family="Menlo, Consolas, monospace" fill="#34495E">mm.procedural.lookup_</text>
  <text x="1213" y="571" font-size="10" font-family="Menlo, Consolas, monospace" fill="#34495E">  disease("Hypertension")</text>
  <text x="1213" y="585" font-size="10" font-family="Menlo, Consolas, monospace" fill="#34495E">→ {NG136 · 1st-line: ACE-i...}</text>

  <!-- ── Bottom band — scope axis ── -->
  <rect x="40" y="600" width="1520" height="62" rx="10" fill="#F4F6F7" stroke="#AAB7C4" stroke-width="1"/>
  <text x="60"  y="620" font-size="11" font-weight="bold" fill="#34495E">SCOPE  ─→  longer lifespan, broader reuse</text>

  <line x1="60" y1="640" x2="1540" y2="640" stroke="#7F8C8D" stroke-width="1.3" marker-end="url(#arrowDashed)"/>
  <g font-size="10" fill="#5D6D7E" text-anchor="middle">
    <text x="225" y="656">one LLM call</text>
    <text x="610" y="656">one patient run</text>
    <text x="995" y="656">all past patients</text>
    <text x="1378" y="656">long-term knowledge</text>
  </g>

  <!-- ── Footer band — what changed ── -->
  <rect x="40" y="678" width="1520" height="58" rx="10" fill="#FEF9E7" stroke="#D4AC0D" stroke-width="1"/>
  <text x="60" y="700" font-size="12" font-weight="bold" fill="#7D6608">WHY IT MATTERS</text>
  <text x="60" y="720" font-size="11" fill="#34495E">
    Reviewer cites specific Diagnostic critique rounds  ·  Refiner reads cross-session priors for candidate diseases  ·  next run inherits this run's outcome (no fine-tuning)
  </text>
</svg>
