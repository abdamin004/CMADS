<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 550" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="gMem" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1ABC9C"/><stop offset="100%" stop-color="#148F77"/></linearGradient>
    <linearGradient id="gAgent" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2980B9"/><stop offset="100%" stop-color="#1B5E7B"/></linearGradient>
    <linearGradient id="gOrch" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#E74C3C"/><stop offset="100%" stop-color="#C0392B"/></linearGradient>
    <linearGradient id="gNs" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2ECC71"/><stop offset="100%" stop-color="#27AE60"/></linearGradient>
    <filter id="sh"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1ABC9C"/></marker>
  </defs>

  <text x="550" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1B3A5C">Shared Memory Architecture — Namespace Design</text>

  <!-- Central shared memory store -->
  <rect x="350" y="60" width="400" height="430" rx="14" fill="#E8F8F5" stroke="#1ABC9C" stroke-width="2" filter="url(#sh)"/>
  <rect x="350" y="60" width="400" height="40" rx="14" fill="url(#gMem)"/>
  <rect x="350" y="86" width="400" height="14" fill="url(#gMem)"/>
  <text x="550" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFF">SHARED MEMORY STORE</text>

  <!-- Namespace: patient_context -->
  <rect x="370" y="115" width="360" height="60" rx="6" fill="#FFF" stroke="#27AE60" stroke-width="1.5"/>
  <rect x="370" y="115" width="360" height="22" rx="6" fill="url(#gNs)"/>
  <rect x="370" y="130" width="360" height="7" fill="url(#gNs)"/>
  <text x="380" y="131" font-size="10" font-weight="bold" fill="#FFF">patient_context</text>
  <text x="380" y="153" font-size="9" fill="#555">demographics, conditions, medications, allergies, risk_scores</text>
  <text x="380" y="166" font-size="9" fill="#888">Written by: Orchestrator  |  Read by: All agents</text>

  <!-- Namespace: agent_outputs -->
  <rect x="370" y="190" width="360" height="72" rx="6" fill="#FFF" stroke="#2980B9" stroke-width="1.5"/>
  <rect x="370" y="190" width="360" height="22" rx="6" fill="url(#gAgent)"/>
  <rect x="370" y="205" width="360" height="7" fill="url(#gAgent)"/>
  <text x="380" y="206" font-size="10" font-weight="bold" fill="#FFF">agent_outputs</text>
  <text x="380" y="227" font-size="9" fill="#555">agent_outputs.ehr_analyst → clinical_summary {JSON}</text>
  <text x="380" y="239" font-size="9" fill="#555">agent_outputs.lab_interpreter → lab_findings {JSON}</text>
  <text x="380" y="251" font-size="9" fill="#555">agent_outputs.diagnostic → differential_dx {JSON}  ...</text>

  <!-- Namespace: conflicts -->
  <rect x="370" y="277" width="360" height="55" rx="6" fill="#FFF" stroke="#E74C3C" stroke-width="1.5"/>
  <rect x="370" y="277" width="360" height="22" rx="6" fill="url(#gOrch)"/>
  <rect x="370" y="292" width="360" height="7" fill="url(#gOrch)"/>
  <text x="380" y="293" font-size="10" font-weight="bold" fill="#FFF">conflicts</text>
  <text x="380" y="314" font-size="9" fill="#555">Contradictory diagnoses, treatment vs. condition flags</text>
  <text x="380" y="325" font-size="9" fill="#888">Written by: Orchestrator (diff engine)  |  Read by: Synthesis</text>

  <!-- Namespace: scratchpad -->
  <rect x="370" y="347" width="170" height="55" rx="6" fill="#FFF" stroke="#F39C12" stroke-width="1.5"/>
  <rect x="370" y="347" width="170" height="22" rx="6" fill="#F39C12"/>
  <rect x="370" y="362" width="170" height="7" fill="#F39C12"/>
  <text x="380" y="363" font-size="10" font-weight="bold" fill="#FFF">scratchpad</text>
  <text x="380" y="384" font-size="9" fill="#555">Per-agent working</text>
  <text x="380" y="395" font-size="9" fill="#555">notes (ephemeral)</text>

  <!-- Namespace: trace -->
  <rect x="560" y="347" width="170" height="55" rx="6" fill="#FFF" stroke="#8E44AD" stroke-width="1.5"/>
  <rect x="560" y="347" width="170" height="22" rx="6" fill="#8E44AD"/>
  <rect x="560" y="362" width="170" height="7" fill="#8E44AD"/>
  <text x="570" y="363" font-size="10" font-weight="bold" fill="#FFF">execution_trace</text>
  <text x="570" y="384" font-size="9" fill="#555">Timestamps, tokens,</text>
  <text x="570" y="395" font-size="9" fill="#555">status per agent</text>

  <!-- Access control table -->
  <rect x="370" y="418" width="360" height="60" rx="6" fill="#F8F9FA" stroke="#CCC" stroke-width="1"/>
  <text x="380" y="436" font-size="10" font-weight="bold" fill="#333">Access Policy</text>
  <text x="380" y="452" font-size="9" fill="#555">Write-own / Read-all: Agents write to their namespace, read others</text>
  <text x="380" y="466" font-size="9" fill="#555">Orchestrator: Full R/W to all namespaces (admin)</text>

  <!-- Left agents panel -->
  <rect x="30" y="120" width="280" height="360" rx="10" fill="#F0F4F8" stroke="#D0D8E0" stroke-width="1"/>
  <text x="170" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">AGENT READ/WRITE OPS</text>

  <!-- Agent boxes on left -->
  <rect x="50" y="160" width="120" height="32" rx="5" fill="url(#gAgent)" filter="url(#sh)"/>
  <text x="110" y="180" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFF">EHR Analyst</text>

  <rect x="50" y="205" width="120" height="32" rx="5" fill="url(#gAgent)" filter="url(#sh)"/>
  <text x="110" y="225" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFF">Lab Interpreter</text>

  <rect x="50" y="250" width="120" height="32" rx="5" fill="url(#gAgent)" filter="url(#sh)"/>
  <text x="110" y="270" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFF">Diagnostic</text>

  <rect x="50" y="295" width="120" height="32" rx="5" fill="url(#gAgent)" filter="url(#sh)"/>
  <text x="110" y="315" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFF">Treatment</text>

  <rect x="50" y="340" width="120" height="32" rx="5" fill="url(#gAgent)" filter="url(#sh)"/>
  <text x="110" y="360" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFF">Radiology</text>

  <rect x="50" y="385" width="120" height="32" rx="5" fill="url(#gAgent)" filter="url(#sh)"/>
  <text x="110" y="405" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFF">Reviewer</text>

  <rect x="50" y="430" width="120" height="32" rx="5" fill="#1B3A5C" filter="url(#sh)"/>
  <text x="110" y="450" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFD700">Synthesis</text>

  <!-- R/W labels -->
  <text x="195" y="178" font-size="9" fill="#27AE60" font-weight="bold">R</text><text x="210" y="178" font-size="9" fill="#555">patient_ctx</text>
  <text x="195" y="192" font-size="9" fill="#E74C3C" font-weight="bold">W</text><text x="210" y="192" font-size="9" fill="#555">agent_outputs.ehr</text>

  <text x="195" y="223" font-size="9" fill="#27AE60" font-weight="bold">R</text><text x="210" y="223" font-size="9" fill="#555">patient_ctx</text>
  <text x="195" y="237" font-size="9" fill="#E74C3C" font-weight="bold">W</text><text x="210" y="237" font-size="9" fill="#555">agent_outputs.lab</text>

  <text x="195" y="265" font-size="9" fill="#27AE60" font-weight="bold">R</text><text x="210" y="265" font-size="9" fill="#555">ehr + lab outputs</text>
  <text x="195" y="279" font-size="9" fill="#E74C3C" font-weight="bold">W</text><text x="210" y="279" font-size="9" fill="#555">agent_outputs.diag</text>

  <text x="195" y="313" font-size="9" fill="#27AE60" font-weight="bold">R</text><text x="210" y="313" font-size="9" fill="#555">diag output + meds</text>
  <text x="195" y="327" font-size="9" fill="#E74C3C" font-weight="bold">W</text><text x="210" y="327" font-size="9" fill="#555">agent_outputs.treat</text>

  <text x="195" y="358" font-size="9" fill="#27AE60" font-weight="bold">R</text><text x="210" y="358" font-size="9" fill="#555">diag + radiology rpts</text>
  <text x="195" y="372" font-size="9" fill="#E74C3C" font-weight="bold">W</text><text x="210" y="372" font-size="9" fill="#555">agent_outputs.rad</text>

  <text x="195" y="403" font-size="9" fill="#27AE60" font-weight="bold">R</text><text x="210" y="403" font-size="9" fill="#555">diag + treat + rad</text>
  <text x="195" y="417" font-size="9" fill="#E74C3C" font-weight="bold">W</text><text x="210" y="417" font-size="9" fill="#555">agent_outputs.review</text>

  <text x="195" y="448" font-size="9" fill="#27AE60" font-weight="bold">R</text><text x="210" y="448" font-size="9" fill="#555">ALL + conflicts</text>
  <text x="195" y="462" font-size="9" fill="#E74C3C" font-weight="bold">W</text><text x="210" y="462" font-size="9" fill="#555">final_report</text>

  <!-- Connection arrows left → memory -->
  <line x1="310" y1="176" x2="370" y2="150" stroke="#1ABC9C" stroke-width="1.2" marker-end="url(#arrT)"/>
  <line x1="310" y1="221" x2="370" y2="210" stroke="#1ABC9C" stroke-width="1.2" marker-end="url(#arrT)"/>
  <line x1="310" y1="266" x2="370" y2="230" stroke="#1ABC9C" stroke-width="1.2" marker-end="url(#arrT)"/>
  <line x1="310" y1="311" x2="370" y2="240" stroke="#1ABC9C" stroke-width="1.2" marker-end="url(#arrT)"/>
  <line x1="310" y1="356" x2="370" y2="250" stroke="#1ABC9C" stroke-width="1.2" marker-end="url(#arrT)"/>
  <line x1="310" y1="401" x2="370" y2="300" stroke="#1ABC9C" stroke-width="1.2" marker-end="url(#arrT)"/>
  <line x1="310" y1="446" x2="370" y2="350" stroke="#1ABC9C" stroke-width="1.2" marker-end="url(#arrT)"/>

  <!-- Right side: Orchestrator -->
  <rect x="790" y="150" width="280" height="310" rx="10" fill="#FDF2F2" stroke="#E0B8B8" stroke-width="1"/>
  <text x="930" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">ORCHESTRATOR OPS</text>

  <rect x="810" y="195" width="240" height="40" rx="5" fill="url(#gOrch)" filter="url(#sh)"/>
  <text x="930" y="215" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFF">1. Load Gold → patient_context</text>

  <rect x="810" y="250" width="240" height="40" rx="5" fill="url(#gOrch)" filter="url(#sh)"/>
  <text x="930" y="270" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFF">2. Dispatch agents by stage</text>

  <rect x="810" y="305" width="240" height="40" rx="5" fill="url(#gOrch)" filter="url(#sh)"/>
  <text x="930" y="325" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFF">3. Diff → write conflicts</text>

  <rect x="810" y="360" width="240" height="40" rx="5" fill="url(#gOrch)" filter="url(#sh)"/>
  <text x="930" y="380" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFF">4. Write execution_trace</text>

  <rect x="810" y="415" width="240" height="28" rx="5" fill="#1B3A5C" filter="url(#sh)"/>
  <text x="930" y="434" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFD700">5. Trigger Synthesis</text>

  <!-- Right → memory arrows -->
  <line x1="810" y1="215" x2="750" y2="150" stroke="#C0392B" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="810" y1="325" x2="750" y2="300" stroke="#C0392B" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="810" y1="380" x2="750" y2="370" stroke="#C0392B" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- Legend -->
  <rect x="370" y="510" width="10" height="8" rx="2" fill="#27AE60"/>
  <text x="386" y="518" font-size="9" fill="#666"><tspan font-weight="bold" fill="#27AE60">R</tspan> = Read</text>
  <rect x="440" y="510" width="10" height="8" rx="2" fill="#E74C3C"/>
  <text x="456" y="518" font-size="9" fill="#666"><tspan font-weight="bold" fill="#E74C3C">W</tspan> = Write</text>
  <text x="530" y="518" font-size="9" fill="#666">Namespace isolation: agents cannot overwrite each other's outputs</text>
</svg>
