<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-opacity="0.1"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C0392B"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1ABC9C"/></marker>
  </defs>

  <text x="550" y="25" text-anchor="middle" font-size="17" font-weight="bold" fill="#1B3A5C">Agent Execution Sequence — Single Patient Case</text>

  <!-- Lifeline headers -->
  <rect x="20" y="42" width="90" height="30" rx="5" fill="#E74C3C" filter="url(#sh)"/>
  <text x="65" y="62" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFF">Orchestrator</text>

  <rect x="150" y="42" width="90" height="30" rx="5" fill="#1ABC9C" filter="url(#sh)"/>
  <text x="195" y="62" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFF">SharedMem</text>

  <rect x="280" y="42" width="90" height="30" rx="5" fill="#2980B9" filter="url(#sh)"/>
  <text x="325" y="62" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFF">EHR Analyst</text>

  <rect x="410" y="42" width="90" height="30" rx="5" fill="#2980B9" filter="url(#sh)"/>
  <text x="455" y="62" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFF">Lab Interp.</text>

  <rect x="540" y="42" width="90" height="30" rx="5" fill="#2980B9" filter="url(#sh)"/>
  <text x="585" y="62" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFF">Diagnostic</text>

  <rect x="670" y="42" width="90" height="30" rx="5" fill="#2980B9" filter="url(#sh)"/>
  <text x="715" y="62" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFF">Treatment</text>

  <rect x="800" y="42" width="90" height="30" rx="5" fill="#2980B9" filter="url(#sh)"/>
  <text x="845" y="62" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFF">Reviewer</text>

  <rect x="930" y="42" width="90" height="30" rx="5" fill="#1B3A5C" filter="url(#sh)"/>
  <text x="975" y="62" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFD700">Synthesis</text>

  <!-- Lifelines -->
  <line x1="65" y1="72" x2="65" y2="600" stroke="#E74C3C" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="195" y1="72" x2="195" y2="600" stroke="#1ABC9C" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="325" y1="72" x2="325" y2="600" stroke="#2980B9" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="455" y1="72" x2="455" y2="600" stroke="#2980B9" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="585" y1="72" x2="585" y2="600" stroke="#2980B9" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="715" y1="72" x2="715" y2="600" stroke="#2980B9" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="845" y1="72" x2="845" y2="600" stroke="#2980B9" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="975" y1="72" x2="975" y2="600" stroke="#1B3A5C" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Phase labels -->
  <rect x="2" y="90" width="16" height="80" rx="3" fill="#F39C12"/>
  <text x="10" y="138" text-anchor="middle" font-size="8" font-weight="bold" fill="#FFF" transform="rotate(-90,10,138)">INIT</text>

  <rect x="2" y="185" width="16" height="110" rx="3" fill="#2980B9"/>
  <text x="10" y="248" text-anchor="middle" font-size="8" font-weight="bold" fill="#FFF" transform="rotate(-90,10,248)">STAGE 1</text>

  <rect x="2" y="310" width="16" height="70" rx="3" fill="#2980B9"/>
  <text x="10" y="350" text-anchor="middle" font-size="8" font-weight="bold" fill="#FFF" transform="rotate(-90,10,350)">STAGE 2</text>

  <rect x="2" y="395" width="16" height="70" rx="3" fill="#2980B9"/>
  <text x="10" y="435" text-anchor="middle" font-size="8" font-weight="bold" fill="#FFF" transform="rotate(-90,10,435)">STG 3-4</text>

  <rect x="2" y="480" width="16" height="100" rx="3" fill="#1B3A5C"/>
  <text x="10" y="535" text-anchor="middle" font-size="8" font-weight="bold" fill="#FFF" transform="rotate(-90,10,535)">STAGE 5</text>

  <!-- INIT: Load gold files into memory -->
  <line x1="65" y1="100" x2="190" y2="100" stroke="#C0392B" stroke-width="1.5" marker-end="url(#arrR)"/>
  <text x="128" y="96" text-anchor="middle" font-size="8" fill="#C0392B">write(patient_context, gold_data)</text>

  <line x1="190" y1="115" x2="70" y2="115" stroke="#1ABC9C" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrG)"/>
  <text x="128" y="127" text-anchor="middle" font-size="8" fill="#888">ack</text>

  <line x1="65" y1="145" x2="190" y2="145" stroke="#C0392B" stroke-width="1.5" marker-end="url(#arrR)"/>
  <text x="128" y="141" text-anchor="middle" font-size="8" fill="#C0392B">init_trace(case_id, config)</text>

  <!-- STAGE 1: Dispatch EHR + Lab in parallel -->
  <rect x="55" y="185" width="910" height="110" rx="0" fill="#EBF5FB" opacity="0.3"/>

  <line x1="65" y1="200" x2="320" y2="200" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="192" y="196" text-anchor="middle" font-size="8" fill="#555">invoke(ehr_analyst, {ehr_case})</text>

  <line x1="65" y1="210" x2="450" y2="210" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="257" y="222" text-anchor="middle" font-size="8" fill="#555">invoke(lab_interpreter, {lab_case})</text>

  <!-- Parallel execution box -->
  <rect x="300" y="230" width="50" height="30" rx="3" fill="#FFF" stroke="#2980B9" stroke-width="1"/>
  <text x="325" y="249" text-anchor="middle" font-size="8" fill="#2980B9">LLM</text>
  <rect x="430" y="230" width="50" height="30" rx="3" fill="#FFF" stroke="#2980B9" stroke-width="1"/>
  <text x="455" y="249" text-anchor="middle" font-size="8" fill="#2980B9">LLM</text>
  <text x="390" y="248" text-anchor="middle" font-size="9" fill="#F39C12" font-weight="bold">||</text>

  <!-- Write outputs to memory -->
  <line x1="325" y1="265" x2="200" y2="275" stroke="#1ABC9C" stroke-width="1" marker-end="url(#arrG)"/>
  <text x="250" y="262" font-size="7" fill="#1ABC9C">write(agent_outputs.ehr)</text>

  <line x1="455" y1="265" x2="200" y2="285" stroke="#1ABC9C" stroke-width="1" marker-end="url(#arrG)"/>
  <text x="360" y="280" font-size="7" fill="#1ABC9C">write(agent_outputs.lab)</text>

  <!-- Return to orchestrator -->
  <line x1="195" y1="290" x2="70" y2="290" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="128" y="300" text-anchor="middle" font-size="7" fill="#888">stage_1_complete</text>

  <!-- Conflict check -->
  <rect x="50" y="305" width="30" height="15" rx="2" fill="#F39C12"/>
  <text x="65" y="315" text-anchor="middle" font-size="7" fill="#FFF">diff</text>

  <!-- STAGE 2: Diagnostic -->
  <rect x="55" y="320" width="910" height="65" rx="0" fill="#FEF9E7" opacity="0.3"/>

  <line x1="65" y1="330" x2="580" y2="330" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="322" y="326" text-anchor="middle" font-size="8" fill="#555">invoke(diagnostic, {read: ehr + lab outputs from memory})</text>

  <rect x="560" y="340" width="50" height="25" rx="3" fill="#FFF" stroke="#2980B9" stroke-width="1"/>
  <text x="585" y="357" text-anchor="middle" font-size="8" fill="#2980B9">LLM</text>

  <line x1="585" y1="365" x2="200" y2="375" stroke="#1ABC9C" stroke-width="1" marker-end="url(#arrG)"/>
  <text x="390" y="365" font-size="7" fill="#1ABC9C">write(agent_outputs.diagnostic)</text>

  <line x1="195" y1="380" x2="70" y2="380" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- STAGE 3+4: Treatment + Reviewer -->
  <rect x="55" y="395" width="910" height="75" rx="0" fill="#F5EEF8" opacity="0.3"/>

  <line x1="65" y1="410" x2="710" y2="410" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="387" y="406" text-anchor="middle" font-size="8" fill="#555">invoke(treatment, {read: diag output + medication data})</text>

  <rect x="690" y="418" width="50" height="22" rx="3" fill="#FFF" stroke="#2980B9" stroke-width="1"/>
  <text x="715" y="433" text-anchor="middle" font-size="7" fill="#2980B9">LLM</text>

  <line x1="715" y1="440" x2="200" y2="448" stroke="#1ABC9C" stroke-width="1" marker-end="url(#arrG)"/>

  <line x1="65" y1="455" x2="840" y2="455" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="452" y="451" text-anchor="middle" font-size="8" fill="#555">invoke(reviewer, {read: diag + treat + rad from memory})</text>

  <line x1="845" y1="465" x2="200" y2="465" stroke="#1ABC9C" stroke-width="1" marker-end="url(#arrG)"/>

  <!-- STAGE 5: Synthesis -->
  <rect x="55" y="480" width="910" height="100" rx="0" fill="#EBF5FB" opacity="0.2"/>

  <!-- Orchestrator writes conflicts before synthesis -->
  <line x1="65" y1="495" x2="190" y2="495" stroke="#C0392B" stroke-width="1.5" marker-end="url(#arrR)"/>
  <text x="128" y="491" text-anchor="middle" font-size="7" fill="#C0392B">write(conflicts)</text>

  <line x1="65" y1="515" x2="970" y2="515" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="517" y="511" text-anchor="middle" font-size="8" fill="#555">invoke(synthesis, {read: ALL agent_outputs + conflicts + patient_context})</text>

  <rect x="950" y="525" width="50" height="22" rx="3" fill="#FFF" stroke="#1B3A5C" stroke-width="1"/>
  <text x="975" y="540" text-anchor="middle" font-size="7" fill="#1B3A5C">LLM</text>

  <line x1="975" y1="547" x2="200" y2="555" stroke="#1ABC9C" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="587" y="547" text-anchor="middle" font-size="7" fill="#1ABC9C">write(final_report)</text>

  <!-- Final: orchestrator writes trace and returns -->
  <line x1="65" y1="570" x2="190" y2="570" stroke="#C0392B" stroke-width="1" marker-end="url(#arrR)"/>
  <text x="128" y="566" text-anchor="middle" font-size="7" fill="#C0392B">finalize_trace()</text>

  <rect x="40" y="585" width="180" height="20" rx="4" fill="#2C3E50"/>
  <text x="130" y="599" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFD700">→ Clinical Decision Report</text>
</svg>
