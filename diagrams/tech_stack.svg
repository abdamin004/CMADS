  <rect x="730" y="218" width="340" height="26" rx="10" fill="url(#gMem)"/>
  <rect x="730" y="236" width="340" height="8" fill="url(#gMem)"/>
  <text x="900" y="239" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFF">SHARED MEMORY</text>

  <rect x="750" y="258" width="140" height="36" rx="5" fill="#FFF" stroke="#1ABC9C" stroke-width="1"/>
  <text x="820" y="274" text-anchor="middle" font-size="9" font-weight="bold" fill="#148F77">LangGraph State</text>
  <text x="820" y="286" text-anchor="middle" font-size="8" fill="#666">TypedDict channels</text>

  <rect x="910" y="258" width="140" height="36" rx="5" fill="#FFF" stroke="#1ABC9C" stroke-width="1"/>
  <text x="980" y="274" text-anchor="middle" font-size="9" font-weight="bold" fill="#148F77">Pydantic Models</text>
  <text x="980" y="286" text-anchor="middle" font-size="8" fill="#666">Namespace schemas</text>

  <rect x="750" y="308" width="300" height="36" rx="5" fill="#FFF" stroke="#1ABC9C" stroke-width="1"/>
  <text x="900" y="324" text-anchor="middle" font-size="9" font-weight="bold" fill="#148F77">JSON checkpoints to disk</text>
  <text x="900" y="337" text-anchor="middle" font-size="8" fill="#666">LangGraph MemorySaver / custom FileCheckpointer</text>

  <!-- LLM LAYER (local via Ollama) -->
  <rect x="30" y="390" width="520" height="78" rx="10" fill="#F5EEF8" stroke="#8E44AD" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="30" y="390" width="520" height="26" rx="10" fill="url(#gLLM)"/>
