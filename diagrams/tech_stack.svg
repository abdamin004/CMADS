  <rect x="150" y="533" width="85" height="25" rx="4" fill="#FFF" stroke="#E67E22" stroke-width="1"/>
  <text x="192" y="550" text-anchor="middle" font-size="9" font-weight="bold" fill="#D35400">scikit-learn</text>
  <rect x="250" y="533" width="85" height="25" rx="4" fill="#FFF" stroke="#E67E22" stroke-width="1"/>
  <text x="292" y="550" text-anchor="middle" font-size="9" font-weight="bold" fill="#D35400">matplotlib</text>
  <rect x="350" y="533" width="85" height="25" rx="4" fill="#FFF" stroke="#E67E22" stroke-width="1"/>
  <text x="392" y="550" text-anchor="middle" font-size="9" font-weight="bold" fill="#D35400">DuckDB</text>
  <rect x="450" y="533" width="85" height="25" rx="4" fill="#FFF" stroke="#E67E22" stroke-width="1"/>
  <text x="492" y="550" text-anchor="middle" font-size="9" font-weight="bold" fill="#D35400">structlog</text>

