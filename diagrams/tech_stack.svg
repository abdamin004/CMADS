  <rect x="705" y="533" width="100" height="25" rx="4" fill="#FFF" stroke="#E74C3C" stroke-width="1"/>
  <text x="755" y="550" text-anchor="middle" font-size="9" font-weight="bold" fill="#C0392B">Plotly</text>
  <rect x="820" y="533" width="120" height="25" rx="4" fill="#FFF" stroke="#E74C3C" stroke-width="1"/>
  <text x="880" y="550" text-anchor="middle" font-size="9" font-weight="bold" fill="#C0392B">DuckDB (read)</text>
  <rect x="955" y="533" width="100" height="25" rx="4" fill="#FFF" stroke="#E74C3C" stroke-width="1"/>
  <text x="1005" y="550" text-anchor="middle" font-size="9" font-weight="bold" fill="#C0392B">Graphviz</text>

  <!-- INFRASTRUCTURE -->
  <rect x="30" y="590" width="1040" height="48" rx="10" fill="#F5F7FA" stroke="#AAA" stroke-width="1"/>
  <text x="550" y="610" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">INFRASTRUCTURE</text>
  <text x="100" y="628" font-size="10" fill="#666">Python 3.11+</text>
  <text x="250" y="628" font-size="10" fill="#666">pytest + pytest-asyncio</text>
  <text x="450" y="628" font-size="10" fill="#666">uv / pip</text>
  <text x="560" y="628" font-size="10" fill="#666">Git + pre-commit</text>
  <text x="720" y="628" font-size="10" fill="#666">ruff (lint/format)</text>
  <text x="880" y="628" font-size="10" fill="#666">Local filesystem</text>

  <!-- Connection arrows -->
  <line x1="370" y1="200" x2="370" y2="218" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="900" y1="200" x2="900" y2="218" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="290" y1="368" x2="290" y2="390" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="820" y1="368" x2="820" y2="390" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="290" y1="468" x2="290" y2="490" stroke="#555" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="820" y1="468" x2="820" y2="490" stroke="#555" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="710" y1="298" x2="730" y2="298" stroke="#1ABC9C" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Legend -->
