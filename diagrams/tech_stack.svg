<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="gLG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4A90D9"/><stop offset="100%" stop-color="#2E6BB5"/></linearGradient>
    <linearGradient id="gLC" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2ECC71"/><stop offset="100%" stop-color="#27AE60"/></linearGradient>
    <linearGradient id="gLLM" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8E44AD"/><stop offset="100%" stop-color="#6C3483"/></linearGradient>
    <linearGradient id="gMem" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1ABC9C"/><stop offset="100%" stop-color="#148F77"/></linearGradient>
    <linearGradient id="gEval" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#E67E22"/><stop offset="100%" stop-color="#D35400"/></linearGradient>
    <linearGradient id="gUI" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#E74C3C"/><stop offset="100%" stop-color="#C0392B"/></linearGradient>
    <linearGradient id="gConf" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F39C12"/><stop offset="100%" stop-color="#E67E22"/></linearGradient>
    <filter id="sh"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#DAA520"/></marker>
  </defs>

  <text x="550" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#1B3A5C">Agent Pipeline — Final Technology Stack</text>

  <!-- DATA SOURCE: SYNTHEA -->
  <rect x="30" y="40" width="1040" height="65" rx="10" fill="#2C3E50" filter="url(#sh)"/>
  <text x="550" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFD700">SINGLE DATA SOURCE — Synthea (Java CLI)</text>
  <text x="550" y="80" text-anchor="middle" font-size="10" fill="#BDC3C7">Rule-based GMF state machines | Monte Carlo simulation | CDC/NIH statistics | CSV + FHIR R4 output</text>
  <text x="550" y="95" text-anchor="middle" font-size="9" fill="#7F8C8D">All patient data originates here. Data Pipeline transforms Synthea output into Gold JSON. Agents consume structured data directly.</text>

  <line x1="550" y1="105" x2="550" y2="122" stroke="#DAA520" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="660" y="118" font-size="8" fill="#DAA520">Gold JSON (ehr_case + lab_case)</text>

  <!-- ORCHESTRATION LAYER -->
  <rect x="30" y="125" width="1040" height="75" rx="10" fill="#EBF5FB" stroke="#4A90D9" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="30" y="125" width="1040" height="26" rx="10" fill="url(#gLG)"/>
  <rect x="30" y="142" width="1040" height="9" fill="url(#gLG)"/>
  <text x="550" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFF">ORCHESTRATION — LangGraph (StateGraph)</text>
  <text x="50" y="178" font-size="10" fill="#2E6BB5" font-weight="600">Declarative DAG</text>
  <text x="200" y="178" font-size="10" fill="#555">| Conditional edges | Parallel branches | State channels | Checkpointing | Retry policies</text>
  <text x="880" y="178" font-size="9" fill="#888">langgraph==0.2.x</text>

  <!-- AGENT LAYER -->
  <rect x="30" y="218" width="680" height="150" rx="10" fill="#F0FAF0" stroke="#27AE60" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="30" y="218" width="680" height="26" rx="10" fill="url(#gLC)"/>
  <rect x="30" y="236" width="680" height="8" fill="url(#gLC)"/>
  <text x="370" y="239" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFF">AGENT RUNTIME — LangChain</text>

  <rect x="50" y="258" width="130" height="44" rx="5" fill="#FFF" stroke="#27AE60" stroke-width="1"/>
  <text x="115" y="277" text-anchor="middle" font-size="9" font-weight="bold" fill="#27AE60">ChatPromptTemplate</text>
  <text x="115" y="290" text-anchor="middle" font-size="8" fill="#666">Jinja2 prompts</text>

  <rect x="200" y="258" width="130" height="44" rx="5" fill="#FFF" stroke="#27AE60" stroke-width="1"/>
  <text x="265" y="277" text-anchor="middle" font-size="9" font-weight="bold" fill="#27AE60">ChatOllama</text>
  <text x="265" y="290" text-anchor="middle" font-size="8" fill="#666">GPT-o3 120B (local)</text>

  <rect x="350" y="258" width="130" height="44" rx="5" fill="#FFF" stroke="#27AE60" stroke-width="1"/>
  <text x="415" y="277" text-anchor="middle" font-size="9" font-weight="bold" fill="#27AE60">PydanticOutputParser</text>
  <text x="415" y="290" text-anchor="middle" font-size="8" fill="#666">Schema validation</text>

  <rect x="500" y="258" width="100" height="44" rx="5" fill="#FFF" stroke="#27AE60" stroke-width="1"/>
  <text x="550" y="277" text-anchor="middle" font-size="9" font-weight="bold" fill="#27AE60">RunnableSeq</text>
  <text x="550" y="290" text-anchor="middle" font-size="8" fill="#666">LCEL chains</text>

  <rect x="620" y="258" width="75" height="44" rx="5" fill="#FFF" stroke="#27AE60" stroke-width="1"/>
  <text x="657" y="277" text-anchor="middle" font-size="9" font-weight="bold" fill="#27AE60">Callbacks</text>
  <text x="657" y="290" text-anchor="middle" font-size="8" fill="#666">Token log</text>

  <text x="50" y="336" font-size="9" fill="#555">Pydantic v2 output schemas | LCEL | .with_structured_output()</text>
  <text x="550" y="336" font-size="9" fill="#888">langchain==0.3.x</text>

