<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CMADS Chapter 3 Diagrams</title>
  <style>
    :root {
      --ink: #17212b;
      --muted: #5f6d7a;
      --page: #f7fafc;
      --panel: #ffffff;
      --line: #bcc8d4;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--page);
      font-family: Inter, "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
    }

    #root {
      display: grid;
      gap: 48px;
      padding: 0;
    }

    svg.diagram {
      display: block;
      overflow: hidden;
      background: var(--page);
    }

    .title {
      font-size: 44px;
      font-weight: 800;
      letter-spacing: 0;
      fill: var(--ink);
    }

    .subtitle {
      font-size: 23px;
      fill: var(--muted);
    }

    .section {
      font-size: 26px;
      font-weight: 800;
      fill: var(--ink);
    }

    .box-title {
      font-size: 24px;
      font-weight: 800;
      fill: var(--ink);
    }

    .box-body {
      font-size: 20px;
      fill: var(--muted);
    }

    .small {
      font-size: 17px;
      fill: var(--muted);
    }

    .label {
      font-size: 17px;
      font-weight: 800;
      fill: var(--muted);
      letter-spacing: 0;
    }

    .mono {
      font-family: "JetBrains Mono", Menlo, Consolas, monospace;
    }
  </style>
</head>
<body>
  <main id="root"></main>

  <script>
    const NS = "http://www.w3.org/2000/svg";

    const C = {
      ink: "#17212b",
      muted: "#5f6d7a",
      page: "#f7fafc",
      panel: "#ffffff",
      panelAlt: "#fbfdff",
      line: "#bcc8d4",
      lineDark: "#8a98a8",
      blue: "#286f9e",
      blueSoft: "#e7f2fb",
      cyan: "#2aa3b5",
      cyanSoft: "#e6f7fa",
      teal: "#168b83",
      tealSoft: "#e5f4f2",
      green: "#2f8f5b",
      greenSoft: "#e8f5ec",
      amber: "#d89418",
      amberSoft: "#fff2d8",
      violet: "#675bb5",
      violetSoft: "#efedfb",
      red: "#c84f4f",
      redSoft: "#fbecec",
      slate: "#324150",
      slateSoft: "#eef3f7",
      dark: "#24272b",
      darkPanel: "#1b1d21",
      darkTile: "#111317"
    };

    const FIGURES = {
      system_architecture: { width: 1800, height: 1040, draw: drawSystemArchitecture },
      data_pipeline: { width: 1800, height: 900, draw: drawDataPipeline },
      agent_pipeline: { width: 1800, height: 1180, draw: drawAgentPipeline },
      multilevel_memory: { width: 1800, height: 1000, draw: drawMultilevelMemory },
      agent_blueprint: { width: 1800, height: 920, draw: drawAgentBlueprint },
      agent_ehr_flow: { width: 1800, height: 650, draw: drawEhrFlow },
      agent_lab_flow: { width: 1800, height: 650, draw: drawLabFlow },
      agent_diag_flow: { width: 1800, height: 1080, draw: drawDiagnosticFlow },
      agent_reviewer_flow: { width: 1800, height: 650, draw: drawReviewerFlow },
      agent_refiner_flow: { width: 1800, height: 850, draw: drawRefinerFlow },
      tech_stack: { width: 1800, height: 1400, draw: drawTechStack }
    };

    function el(name, attrs = {}, children = []) {
      const node = document.createElementNS(NS, name);
      for (const [key, value] of Object.entries(attrs)) {
        node.setAttribute(key, String(value));
      }
      for (const child of children) node.appendChild(child);
      return node;
    }

    function append(svg, node) {
      svg.appendChild(node);
      return node;
    }

    function normalizeTextAttrs(attrs = {}) {
      const styleKeys = ["fill", "font-size", "font-weight", "font-style", "font-family", "letter-spacing", "text-anchor"];
      const clean = { ...attrs };
      const style = [];
      for (const key of styleKeys) {
        if (clean[key] !== undefined) {
          style.push(`${key}: ${clean[key]}`);
          delete clean[key];
        }
      }
      if (clean.style) style.unshift(clean.style);
      if (style.length) clean.style = style.join("; ");
      return clean;
    }

    function text(svg, x, y, value, className = "small", attrs = {}) {
      const node = el("text", { x, y, class: className, ...normalizeTextAttrs(attrs) });
      node.textContent = value;
      return append(svg, node);
    }

    function lines(svg, x, y, values, className = "box-body", gap = 28, attrs = {}) {
      const node = el("text", { x, y, class: className, ...normalizeTextAttrs(attrs) });
      values.forEach((value, index) => {
        const t = el("tspan", { x, dy: index === 0 ? 0 : gap });
        t.textContent = value;
        node.appendChild(t);
      });
      return append(svg, node);
    }

    function title(svg, heading, subheading, opts = {}) {
      const x = opts.x || 72;
      const y = opts.y || 76;
      text(svg, x, y, heading, "title", opts.dark ? { fill: "#f7fafc" } : {});
      text(svg, x + 2, y + 40, subheading, "subtitle", opts.dark ? { fill: "#c9d2dc" } : {});
    }

    function defs(svg, prefix) {
      const defsNode = el("defs");
      for (const [name, color] of Object.entries({
        dark: C.slate,
        blue: C.blue,
        cyan: C.cyan,
        teal: C.teal,
        green: C.green,
        amber: C.amber,
        violet: C.violet,
        red: C.red,
        white: "#f7fafc"
      })) {
        const marker = el("marker", {
          id: `${prefix}-arrow-${name}`,
          viewBox: "0 0 10 10",
          refX: 9,
          refY: 5,
          markerWidth: 8,
          markerHeight: 8,
          orient: "auto"
        });
        marker.appendChild(el("path", {
          d: "M 1 1.2 Q 9.2 5 1 8.8 Q 3.4 5 1 1.2 Z",
          fill: color,
          stroke: color,
          "stroke-linejoin": "round"
        }));
        defsNode.appendChild(marker);
      }

      const shadow = el("filter", { id: `${prefix}-shadow`, x: "-8%", y: "-12%", width: "116%", height: "128%" });
      shadow.appendChild(el("feDropShadow", {
        dx: 0,
        dy: 4,
        stdDeviation: 5,
        "flood-color": "#17212b",
        "flood-opacity": 0.13
      }));
      defsNode.appendChild(shadow);

      const checker = el("pattern", {
        id: `${prefix}-checker`,
        width: 32,
        height: 32,
        patternUnits: "userSpaceOnUse"
      });
      checker.appendChild(el("rect", { width: 32, height: 32, fill: "#15171b" }));
      checker.appendChild(el("rect", { x: 0, y: 0, width: 16, height: 16, fill: "#1e2126" }));
      checker.appendChild(el("rect", { x: 16, y: 16, width: 16, height: 16, fill: "#1e2126" }));
      defsNode.appendChild(checker);

      svg.appendChild(defsNode);
    }

    function colorOf(key) {
      return C[key] || key || C.slate;
    }

    function softOf(key) {
      return C[`${key}Soft`] || C.slateSoft;
    }

    function arrow(svg, x1, y1, x2, y2, key = "dark", opts = {}) {
      return append(svg, el("line", {
        x1, y1, x2, y2,
        stroke: colorOf(key),
        "stroke-width": opts.width || 3,
        "stroke-linecap": "round",
        "marker-end": `url(#${svg.dataset.prefix}-arrow-${key})`,
        ...(opts.dash ? { "stroke-dasharray": opts.dash } : {})
      }));
    }

    function route(svg, d, key = "dark", opts = {}) {
      return append(svg, el("path", {
        d,
        fill: "none",
        stroke: colorOf(key),
        "stroke-width": opts.width || 3,
        "stroke-linecap": "round",
        "stroke-linejoin": "round",
        "marker-end": `url(#${svg.dataset.prefix}-arrow-${key})`,
        ...(opts.dash ? { "stroke-dasharray": opts.dash } : {})
      }));
    }

    function box(svg, x, y, w, h, heading, body, key = "blue", opts = {}) {
      append(svg, el("rect", {
        x, y, width: w, height: h, rx: opts.rx || 12,
        fill: opts.fill || C.panel,
        stroke: opts.stroke || C.line,
        "stroke-width": opts.strokeWidth || 2,
        ...(opts.shadow ? { filter: `url(#${svg.dataset.prefix}-shadow)` } : {})
      }));
      if (!opts.noStripe) {
        append(svg, el("rect", {
          x, y, width: opts.stripe || 10, height: h,
          rx: opts.rx || 12,
          fill: colorOf(key)
        }));
      }
      if (opts.badge) {
        pill(svg, x + 24, y + 24, opts.badge, key, opts.badgeWidth || 76, { compact: true });
        text(svg, x + 114, y + 50, heading, "box-title", { "font-size": opts.titleSize || 23 });
      } else {
        text(svg, x + 26, y + 43, heading, "box-title", { "font-size": opts.titleSize || 24 });
      }
      lines(svg, x + 26, y + (opts.bodyY || 78), body, "box-body", opts.gap || 27, {
        "font-size": opts.bodySize || 20,
        fill: opts.bodyFill || C.muted
      });
    }

    function panel(svg, x, y, w, h, heading, key = "dark", opts = {}) {
      append(svg, el("rect", {
        x, y, width: w, height: h, rx: opts.rx || 14,
        fill: opts.fill || C.panel,
        stroke: opts.stroke || C.line,
        "stroke-width": opts.strokeWidth || 2,
        ...(opts.shadow ? { filter: `url(#${svg.dataset.prefix}-shadow)` } : {})
      }));
      if (heading) {
        text(svg, x + 24, y + 44, heading, "section", { fill: colorOf(key) });
      }
    }

    function pill(svg, x, y, value, key = "dark", width = 160, opts = {}) {
      const h = opts.compact ? 32 : 38;
      append(svg, el("rect", {
        x, y, width, height: h, rx: h / 2,
        fill: opts.fill || softOf(key),
        stroke: opts.stroke || colorOf(key),
        "stroke-width": opts.strokeWidth || 1.5
      }));
      text(svg, x + width / 2, y + (opts.compact ? 22 : 25), value, "label", {
        fill: opts.textFill || colorOf(key),
        "text-anchor": "middle",
        "font-size": opts.fontSize || (opts.compact ? 15 : 17)
      });
    }

    function numberedStep(svg, x, y, n, key) {
      append(svg, el("circle", { cx: x, cy: y, r: 24, fill: colorOf(key) }));
      text(svg, x, y + 7, String(n), "label", {
        fill: "#ffffff",
        "text-anchor": "middle",
        "font-size": "20px"
      });
    }

    function tinyCard(svg, x, y, w, h, heading, note, key = "blue") {
      append(svg, el("rect", {
        x, y, width: w, height: h, rx: 10,
        fill: softOf(key),
        stroke: colorOf(key),
        "stroke-width": 1.6
      }));
      text(svg, x + 18, y + 31, heading, "label", { fill: colorOf(key), "font-size": "17px" });
      if (note) text(svg, x + 18, y + 56, note, "small", { "font-size": "15px" });
    }

    function drawSystemArchitecture(svg) {
      title(svg, "CMADS Methodology Architecture",
            "A black-box view of the data plane, agentic reasoning core, memory plane, and doctor-facing outputs.");

      const laneX = 70;
      const laneW = 1660;
      const lanes = [
        { y: 150, h: 170, label: ["Data", "preparation", "plane"], color: "teal" },
        { y: 365, h: 230, label: ["Agentic", "reasoning", "plane"], color: "blue" },
        { y: 640, h: 150, label: ["Memory and", "knowledge", "plane"], color: "violet" },
        { y: 835, h: 130, label: ["Clinical", "output", "plane"], color: "green" }
      ];

      lanes.forEach(lane => {
        append(svg, el("rect", {
          x: laneX, y: lane.y, width: laneW, height: lane.h, rx: 18,
          fill: C.panel,
          stroke: C.line,
          "stroke-width": 2,
          filter: `url(#${svg.dataset.prefix}-shadow)`
        }));
        append(svg, el("rect", {
          x: laneX, y: lane.y, width: 250, height: lane.h, rx: 18,
          fill: softOf(lane.color),
          stroke: colorOf(lane.color),
          "stroke-width": 0
        }));
        lines(svg, laneX + 34, lane.y + 54, lane.label, "section", 34, {
          fill: colorOf(lane.color),
          "font-size": "24px"
        });
      });

      box(svg, 380, 178, 270, 120, "Synthea", ["1,000 synthetic", "FHIR R4 patients"], "teal", {
        fill: C.tealSoft,
        bodyY: 72,
        gap: 24
      });
      box(svg, 720, 178, 300, 120, "Medallion pipeline", ["Bronze, Silver, Gold", "OMOP features"], "teal", {
        fill: C.tealSoft,
        bodyY: 72,
        gap: 24
      });
      box(svg, 1090, 178, 300, 120, "Gold case objects", ["EHR + lab JSON", "ground truth hidden"], "teal", {
        fill: C.tealSoft,
        bodyY: 72,
        gap: 24
      });
      box(svg, 1460, 178, 210, 120, "NICE corpus", ["guideline chunks", "Qdrant store"], "amber", {
        fill: C.amberSoft,
        bodyY: 72,
        gap: 24
      });
      arrow(svg, 650, 238, 720, 238, "teal");
      arrow(svg, 1020, 238, 1090, 238, "teal");

      panel(svg, 430, 400, 990, 170, "", "blue", { fill: C.blueSoft, stroke: C.blue });
      text(svg, 475, 461, "LangGraph multi-agent system", "section", { fill: C.blue, "font-size": "30px" });
      text(svg, 477, 502, "seven specialised agents coordinate diagnosis, review, treatment, and memory consolidation", "box-body", {
        fill: C.ink,
        "font-size": "20px"
      });
      pill(svg, 500, 517, "EHR", "teal", 88);
      pill(svg, 605, 517, "Labs", "teal", 98);
      pill(svg, 725, 517, "Reason", "blue", 128);
      pill(svg, 875, 517, "Review", "red", 120);
      pill(svg, 1015, 517, "Refine", "violet", 120);
      pill(svg, 1155, 517, "Judge", "amber", 116);
      pill(svg, 1290, 517, "Treat", "green", 112);

      route(svg, "M1240 298 L1240 365 L925 365 L925 405", "teal", { width: 4 });
      route(svg, "M1565 298 L1565 470 L1420 470", "amber", { width: 4, dash: "10 7" });

      box(svg, 390, 675, 390, 86, "Multi-level memory", ["T1/T2 run state, T3/T4 durable recall"], "violet", {
        fill: C.violetSoft,
        bodyY: 61,
        bodySize: 18
      });
      box(svg, 860, 675, 350, 86, "Qdrant collections", ["patient_cases and nice_guidelines"], "amber", {
        fill: C.amberSoft,
        bodyY: 61,
        bodySize: 18
      });
      box(svg, 1290, 675, 360, 86, "Execution trace", ["per-agent JSON outputs and timings"], "blue", {
        fill: C.blueSoft,
        bodyY: 61,
        bodySize: 18
      });
      route(svg, "M650 570 L650 675", "violet", { width: 3, dash: "8 7" });
      route(svg, "M1035 570 L1035 675", "amber", { width: 3, dash: "8 7" });
      route(svg, "M1440 570 L1440 675", "blue", { width: 3, dash: "8 7" });

      box(svg, 390, 857, 330, 92, "Research results", ["metrics, traces, case files"], "green", {
        fill: C.greenSoft,
        bodyY: 66,
        bodySize: 15,
        titleSize: 21
      });
      box(svg, 805, 857, 350, 92, "Streamlit dashboard", ["experiment and memory review"], "violet", {
        fill: C.violetSoft,
        bodyY: 66,
        bodySize: 15,
        titleSize: 21
      });
      box(svg, 1240, 857, 360, 92, "Doctor console", ["interactive patient walkthrough"], "blue", {
        fill: C.blueSoft,
        bodyY: 66,
        bodySize: 15,
        titleSize: 21
      });
      arrow(svg, 585, 761, 555, 857, "green");
      arrow(svg, 1035, 761, 980, 857, "violet");
      arrow(svg, 1440, 761, 1420, 857, "blue");
    }

    function drawDataPipeline(svg) {
      title(svg, "Synthetic Data Generation and Gold-Case Construction",
            "Deterministic ETL and an LLM detectability gate convert raw synthetic records into diagnosable cases.");

      const y = 215;
      const steps = [
        { key: "teal", title: "Synthea cohort", body: ["1,000 patients", "FHIR R4 bundles"] },
        { key: "blue", title: "Bronze ingest", body: ["raw Parquet", "audit-preserved"] },
        { key: "blue", title: "Silver OMOP", body: ["OMOP CDM v5.4", "standard tables"] },
        { key: "cyan", title: "Silver+ features", body: ["lab trends", "eGFR and flags"] },
        { key: "amber", title: "Eligibility filter", body: ["8 diseases", "encounters + labs"] },
        { key: "red", title: "Detectability gate", body: ["Qwen3 verifier", "YES and conf >= 80"] },
        { key: "green", title: "Gold cases", body: ["270 candidates", "agent-ready JSON"] }
      ];
      const startX = 65;
      const w = 220;
      const gap = 26;
      steps.forEach((step, i) => {
        const x = startX + i * (w + gap);
        numberedStep(svg, x + 28, y - 28, i + 1, step.key);
        box(svg, x, y, w, 142, step.title, step.body, step.key, {
          fill: softOf(step.key),
          bodySize: 18,
          gap: 25,
          titleSize: 21
        });
        if (i < steps.length - 1) arrow(svg, x + w, y + 71, x + w + gap - 8, y + 71, "dark", { width: 3 });
      });

      panel(svg, 110, 455, 1580, 175, "Gold output contract", "green", { fill: C.panelAlt });
      const out = [
        { title: "ehr_case.json", note: "demographics, encounters, conditions, medications", key: "teal" },
        { title: "lab_case.json", note: "time-series values, ranges, trend flags", key: "blue" },
        { title: "ground_truth.json", note: "target disease, first diagnosis date, evaluator only", key: "red" }
      ];
      out.forEach((item, i) => {
        box(svg, 190 + i * 510, 525, 430, 90, item.title, [item.note], item.key, {
          fill: softOf(item.key),
          bodyY: 66,
          bodySize: 16,
          titleSize: 21
        });
      });

      panel(svg, 200, 700, 1400, 118, "Anti-leakage controls", "red", { fill: C.redSoft, stroke: C.red });
      pill(svg, 260, 755, "target diagnosis hidden from reasoning agents", "red", 430);
      pill(svg, 735, 755, "verifier used only before evaluation", "amber", 350);
      pill(svg, 1130, 755, "judge reads ground truth only at Stage 5", "violet", 410);
    }

    function drawAgentPipeline(svg) {
      title(svg, "LangGraph Multi-Agent Workflow",
            "A staged agentic pipeline with parallel evidence extraction, adversarial review, gated treatment, and memory consolidation.");

      const x = 85;
      const stageW = 1110;
      const memX = 1260;
      const memW = 460;
      const stages = [
        {
          y: 165, h: 125, key: "teal", badge: "S1",
          title: "Parallel context extraction",
          body: ["EHR Analyst and Lab Interpreter run concurrently", "reducers merge both outputs safely"],
          agents: ["EHR Analyst", "Lab Interpreter"]
        },
        {
          y: 325, h: 150, key: "blue", badge: "S2",
          title: "Diagnostic reasoning loop",
          body: ["adaptive critique loop when no prior is found", "anti-anchoring split when Tier-4 recall is strong"],
          agents: ["Diagnostic Reasoning"]
        },
        {
          y: 520, h: 125, key: "red", badge: "S3",
          title: "Adversarial clinical review",
          body: ["independent evidence check challenges anchoring", "unsupported claims and missed severe findings"],
          agents: ["Clinical Reviewer"]
        },
        {
          y: 685, h: 125, key: "violet", badge: "S4",
          title: "Diagnostic refinement",
          body: ["reviewer flags are reconciled into one", "clinician-readable final differential"],
          agents: ["Diagnostic Refiner"]
        },
        {
          y: 850, h: 125, key: "amber", badge: "S5",
          title: "LLM-as-Judge evaluation",
          body: ["Qwen3-32B compares top-five differential", "against hidden Synthea ground truth"],
          agents: ["LLM Evaluator"]
        }
      ];

      stages.forEach((stage, i) => {
        box(svg, x, stage.y, stageW, stage.h, stage.title, stage.body, stage.key, {
          badge: stage.badge,
          badgeWidth: 70,
          fill: C.panel,
          shadow: true,
          bodyY: 82,
          bodySize: 18,
          gap: 26,
          titleSize: 24
        });
        const widths = stage.agents.map(agent => Math.min(260, Math.max(150, agent.length * 10 + 58)));
        const totalWidth = widths.reduce((sum, width) => sum + width, 0) + (stage.agents.length - 1) * 18;
        let ax = x + stageW - totalWidth - 34;
        stage.agents.forEach((agent, index) => {
          pill(svg, ax, stage.y + stage.h - 47, agent, stage.key, widths[index], { fontSize: 15 });
          ax += widths[index] + 18;
        });
        if (i < stages.length - 1) {
          arrow(svg, x + stageW / 2, stage.y + stage.h + 4, x + stageW / 2, stages[i + 1].y - 12, "dark", { width: 3 });
        }
      });

      panel(svg, memX, 165, memW, 815, "", "violet", { fill: C.panelAlt, stroke: C.ink, strokeWidth: 2.8, shadow: true });
      text(svg, memX + 30, 220, "Shared memory plane", "section", { fill: C.violet, "font-size": "29px" });
      text(svg, memX + 30, 258, "PipelineState + MemoryManager", "box-title", { "font-size": "23px" });
      text(svg, memX + 30, 290, "read/write context available to every stage", "small", { "font-size": "17px" });
      const tiers = [
        ["T1", "Working", "agent scratchpad", "blue"],
        ["T2", "Episodic", "session event timeline", "violet"],
        ["T3", "Semantic", "disease-level run statistics", "green"],
        ["T4", "Case recall", "Qdrant patient_cases", "amber"]
      ];
      tiers.forEach((tier, i) => {
        const yy = 325 + i * 92;
        tinyCard(svg, memX + 28, yy, memW - 56, 76, `${tier[0]} - ${tier[1]}`, tier[2], tier[3]);
      });
      box(svg, memX + 28, 720, memW - 56, 100, "External guideline knowledge", ["NICE passages in Qdrant", "used only by treatment planning"], "amber", {
        fill: C.amberSoft,
        titleSize: 21,
        bodyY: 63,
        bodySize: 17,
        gap: 23
      });
      box(svg, memX + 28, 848, memW - 56, 86, "Run artifacts", ["agent JSON + execution_trace"], "blue", {
        fill: C.blueSoft,
        titleSize: 21,
        bodyY: 62,
        bodySize: 17
      });

      stages.forEach(stage => {
        const mid = stage.y + stage.h / 2;
        append(svg, el("line", {
          x1: x + stageW,
          y1: mid,
          x2: memX,
          y2: mid,
          stroke: C.violet,
          "stroke-width": 2.4,
          "stroke-linecap": "round",
          "stroke-dasharray": "7 6"
        }));
        append(svg, el("polygon", { points: `${memX - 10},${mid - 6} ${memX},${mid} ${memX - 10},${mid + 6}`, fill: C.violet }));
        append(svg, el("polygon", { points: `${x + stageW + 10},${mid - 6} ${x + stageW},${mid} ${x + stageW + 10},${mid + 6}`, fill: C.violet }));
      });

      box(svg, 85, 1025, 510, 115, "S6 - Treatment planning", ["DIRECT-gated NICE retrieval", "and clinical plan"], "green", {
        fill: C.greenSoft,
        bodyY: 72,
        bodySize: 18,
        gap: 23,
        badge: "S6",
        badgeWidth: 70
      });

    function addTechPattern(svg) {

    function techLayer(svg, x, y, w, h, layer, items, color) {
      append(svg, el("rect", {
        x, y, width: 335, height: h, rx: 18,
        fill: C.panel,
        stroke: color,
        "stroke-width": 2.5,
        filter: `url(#${svg.dataset.prefix}-shadow)`

      append(svg, el("rect", { x, y, width: 12, height: h, rx: 8, fill: color }));
      lines(svg, x + 40, y + 42, layer, "label", 25, {
        fill: color,
        "font-size": "25px"
      });

      const px = x + 450;
      const pw = w - 450;
      append(svg, el("line", {
        x1: x + 335,
        y1: y + h / 2,
        x2: px - 30,
        y2: y + h / 2,
        stroke: C.lineDark,
        "stroke-width": 3,
        "stroke-dasharray": "6 8"
      }));
      append(svg, el("rect", {
        x: px,
        y,
        width: pw,
        height: h,
        rx: 20,
        fill: C.panel,
        stroke: C.line,
        "stroke-width": 2.5,
        filter: `url(#${svg.dataset.prefix}-shadow)`
      }));

      const gap = 16;
      const tokenW = (pw - 76 - gap * (items.length - 1)) / items.length;
      let tx = px + 38;
      items.forEach(item => {
        techToken(svg, tx, y + 22, tokenW, h - 44, item, color);
        tx += tokenW + gap;
      });
    }

    function techToken(svg, x, y, w, h, item, color) {
      append(svg, el("rect", {
        x, y, width: w, height: h, rx: 14,
        fill: C.panelAlt,
        stroke: item.fill || color,
        "stroke-width": 1.5

        fill: C.ink,
        "font-size": item.nameSize || "18px",
        "text-anchor": "middle"
      });
    }

    function createFigure(name) {
      const spec = FIGURES[name];
      const svg = el("svg", {
        class: "diagram",
        width: spec.width,
        height: spec.height,
        viewBox: `0 0 ${spec.width} ${spec.height}`,
        role: "img",
        "aria-label": name
      });
      svg.dataset.prefix = `f-${name}`;
      defs(svg, svg.dataset.prefix);
      spec.draw(svg);
      return svg;
    }

    const params = new URLSearchParams(location.search);
    const selected = params.get("figure");
    const root = document.getElementById("root");
    const names = selected ? [selected] : Object.keys(FIGURES);
    for (const name of names) {
      if (!FIGURES[name]) throw new Error(`Unknown figure: ${name}`);
      const svg = createFigure(name);
      root.appendChild(svg);
      if (selected) {
        document.documentElement.style.width = `${FIGURES[name].width}px`;
        document.documentElement.style.height = `${FIGURES[name].height}px`;
        document.body.style.width = `${FIGURES[name].width}px`;
        document.body.style.height = `${FIGURES[name].height}px`;
      }
    }
