# =============================================================================
# Synthea Configuration — Clinical AI Data Lake Project
# =============================================================================

# --- Output Directory (absolute path to project data/raw) ---
exporter.baseDirectory = /Users/abdelrahmanmohamed/Desktop/Data_Clinincal_Project/data/raw/

# --- Years of patient history to export ---
exporter.years_of_history = 10

# --- FHIR R4 export (disabled — saves ~54GB at 10K patients) ---
exporter.fhir.export = false
exporter.fhir_stu3.export = false
exporter.fhir_dstu2.export = false
exporter.ccda.export = false
exporter.fhir.use_us_core_ig = true
exporter.fhir.us_core_version = 6.1.0
exporter.fhir.transaction_bundle = true
exporter.fhir.bulk_data = false

# --- CSV export (primary source for Bronze CSV tables) ---
exporter.csv.export = true
# Each batch run gets its own subfolder (we manage batch_id in Python)
exporter.csv.folder_per_run = false
exporter.csv.append_mode = false
# Exclude billing noise we don't use
exporter.csv.excluded_files = patient_expenses.csv

# --- Disable unused exporters ---
exporter.text.export = false
exporter.html.export = false
exporter.symptoms.csv.export = false
exporter.symptoms.text.export = false
exporter.cpcds.export = false

# --- Patient generation settings ---
# Ensure deceased patients are also exported (needed for full cohort)
generate.only_alive_patients = false
# Keep all conditions regardless of history window
generate.append_record = false

# --- Demographic settings ---
# Use realistic US population demographics
generate.demographics.default_file = geography/demographics.csv
generate.geography.zipcodes.default_file = geography/zipcodes.csv

# --- Condition probability (increase disease module prevalence) ---
# These modules will be run; prevalence is module-defined
generate.disorders.fixedRecordPath =
